<style>
  :root {
    --bg: #ffffff;
    --dot: #cbd5e1;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #334155;
    --border: #cbd5e1;
    --line: #94a3b8;
    --bar-bg: #ffffff;
    --bar-border: #e2e8f0;
    --pill-bg: #f1f5f9;
    --center-bg: #0f172a;
    --center-text: #ffffff;
  }
  body.dark {
    --bg: #070709;
    --dot: #1f2937;
    --card: #111217;
    --text: #f8fafc;
    --muted: #cbd5e1;
    --border: #27272a;
    --line: #475569;
    --bar-bg: #0d0e12;
    --bar-border: #1f2937;
    --pill-bg: #18181b;
    --center-bg: #111217;
    --center-text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.5px, transparent 1.5px);
    background-size: 32px 32px;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Toolbar */
  .toolbar {
    background: var(--bar-bg);
    border-bottom: 1px solid var(--bar-border);
    padding: 10px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
  }
  body.hide-ui .toolbar, body.hide-ui .bottom-bar {
    display: none !important;
  }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab-btn {
    background: var(--pill-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .tab-btn.active {
    background: #F15A22;
    color: #000000;
    border-color: #F15A22;
  }
  .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .step-pill {
    background: var(--pill-bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 11px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
  }
  .step-pill.active {
    background: #10b981;
    color: #ffffff;
    border-color: #059669;
  }

  /* Viewport & Canvas 6000x4200 */
  .viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
  }
  .viewport:active { cursor: grabbing; }

  .canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 6000px;
    height: 4200px;
    transform-origin: 0 0;
    transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .canvas.dragging { transition: none !important; }

  .connectors {
    position: absolute;
    inset: 0;
    width: 6000px;
    height: 4200px;
    pointer-events: none;
    z-index: 1;
  }
  .conn-line {
    stroke: var(--line);
    stroke-width: 5;
    stroke-dasharray: 14 10;
    fill: none;
  }

  .node-box {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 10;
    cursor: pointer;
    transition: opacity 0.35s, box-shadow 0.3s;
  }
  body.no-spoilers .node-box.locked {
    opacity: 0;
    pointer-events: none;
  }

  /* Card Central (Headline) */
  .center-card {
    width: 760px;
    background: var(--center-bg);
    color: var(--center-text);
    border-radius: 28px;
    padding: 46px 48px;
    text-align: center;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.22);
    border: 5px solid #F15A22;
  }
  .center-badge {
    display: inline-block;
    background: #F15A22;
    color: #000000;
    font-size: 14px;
    font-weight: 900;
    padding: 6px 16px;
    border-radius: 99px;
    letter-spacing: 0.08em;
    margin-bottom: 18px;
    text-transform: uppercase;
  }
  .center-title {
    font-size: 42px;
    font-weight: 900;
    line-height: 1.18;
    margin-bottom: 18px;
  }
  .center-sub {
    font-size: 23px;
    font-weight: 700;
    color: #fde68a;
    background: rgba(255,255,255,0.08);
    padding: 12px 22px;
    border-radius: 14px;
    display: inline-block;
  }

  .branch-card {
    width: 720px;
    background: var(--card);
    color: var(--text);

    padding: 40px 44px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
  }
  .branch-card.focused-now {
    border-color: #10b981;
    box-shadow: 0 28px 75px rgba(16, 185, 129, 0.2);
  }
  .branch-card.is-red.focused-now {
    border-color: #ef4444;
    box-shadow: 0 28px 75px rgba(239, 68, 68, 0.22);
  }
  .num-circle {
    position: absolute;
    top: -24px;
    left: -24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #F15A22;
    color: #000000;
    font-weight: 900;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.22);
  }
  .tag-pill {
    display: inline-block;
    font-size: 14px;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .c-red { background: #fee2e2; color: #b91c1c; }
  .c-blue { background: #e0f2fe; color: #0369a1; }
  .c-green { background: #dcfce7; color: #15803d; }
  .c-amber { background: #fef3c7; color: #b45309; }

  .b-title {

    line-height: 1.18;
  }
  .b-highlight {

    .mob-nav { display: flex; }
  }
</style>
</head>

let currentFwIdx = 0;
let currentStep = 0;
let maxUnlockedStep = 0;

let scale = 1;
let tx = 0;
let ty = 0;
let isDragging = false;
let startX = 0;
let startY = 0;

const viewportEl = document.getElementById('viewport');
const canvasEl = document.getElementById('canvas');

function applyTransform() {
  canvasEl.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

function centerCameraOn(wx, wy, targetScale) {
  const vw = viewportEl.clientWidth;
  const vh = viewportEl.clientHeight;
  scale = targetScale;
  tx = (vw / 2) - (wx * scale);
  ty = (vh / 2) - (wy * scale);
  applyTransform();
}

function renderTabs() {
  const row = document.getElementById('tabs-row');
  row.innerHTML = '';
  FWS.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (i === currentFwIdx ? ' active' : '');
    b.textContent = f.tab;
    b.onclick = () => {
      currentFwIdx = i;
      renderTabs();
      loadFW(i);
    };
    row.appendChild(b);
  });
}

function colorClass(c) {

  return 'c-amber';
}

function loadFW(idx) {
  const f = FWS[idx];
  maxUnlockedStep = 0;
  currentStep = 0;

  const svg = document.getElementById('svg-lines');
  let linesHtml = '';
  f.nodes.forEach(n => {
    linesHtml += `<line class="conn-line" x1="${f.center.x}" y1="${f.center.y}" x2="${n.x}" y2="${n.y}" />`;
  });
  linesHtml += `<line class="conn-line" x1="${f.center.x}" y1="${f.center.y}" x2="${f.cta.x}" y2="${f.cta.y}" />`;
  svg.innerHTML = linesHtml;

  const container = document.getElementById('nodes-container');
  container.innerHTML = '';

  // Step 0: Center
  const centerDiv = document.createElement('div');
  centerDiv.className = 'node-box center-card';
  centerDiv.id = 'step-node-0';
  centerDiv.style.left = f.center.x + 'px';
  centerDiv.style.top = f.center.y + 'px';
  centerDiv.onclick = (e) => { e.stopPropagation(); goToStep(0); };
  centerDiv.innerHTML = `
    <div class="center-badge" ondblclick="this.contentEditable=true; this.focus();">${f.center.badge}</div>
    <div class="center-title" ondblclick="this.contentEditable=true; this.focus();">${f.center.title}</div>
    <div class="center-sub" ondblclick="this.contentEditable=true; this.focus();">${f.center.sub}</div>
  `;
  container.appendChild(centerDiv);

  // Steps 1..4
  f.nodes.forEach((n, i) => {
    const stepNum = i + 1;
    const bDiv = document.createElement('div');
    bDiv.className = 'node-box branch-card locked' + (n.color === 'red' ? ' is-red' : '');
    bDiv.id = 'step-node-' + stepNum;
    bDiv.style.left = n.x + 'px';
    bDiv.style.top = n.y + 'px';
    bDiv.onclick = (e) => { e.stopPropagation(); goToStep(stepNum); };
    const hlClass = n.color === 'red' ? 'b-highlight c-red-hl' : 'b-highlight';

    let bodyHtml = '';
    if (n.items && n.items.length) {
      const ico = n.listType === 'x' ? '<span class="ico ico-x">&#10005;</span>' : '<span class="ico ico-v">&#10003;</span>';
      bodyHtml = `<ul class="b-list">${n.items.map(it => `<li ondblclick="this.contentEditable=true; this.focus();">${ico}<span>${it}</span></li>`).join('')}</ul>`;
    } else {
      bodyHtml = `<div class="b-desc" ondblclick="this.contentEditable=true; this.focus();">${n.desc}</div>`;
    }

    bDiv.innerHTML = `
      <div class="num-circle">${n.num}</div>
      <span class="tag-pill ${colorClass(n.color)}" ondblclick="this.contentEditable=true; this.focus();">${n.tag}</span>
      <div class="b-title" ondblclick="this.contentEditable=true; this.focus();">${n.title}</div>
      <div class="${hlClass}" ondblclick="this.contentEditable=true; this.focus();">${n.highlight}</div>
      ${bodyHtml}
    `;
    container.appendChild(bDiv);
  });

  // Step 5: CTA
  const ctaDiv = document.createElement('div');
  ctaDiv.className = 'node-box cta-card locked';
  ctaDiv.id = 'step-node-5';
  ctaDiv.style.left = f.cta.x + 'px';
  ctaDiv.style.top = f.cta.y + 'px';
  ctaDiv.onclick = (e) => { e.stopPropagation(); goToStep(5); };
  ctaDiv.innerHTML = `
    <div class="cta-badge" ondblclick="this.contentEditable=true; this.focus();">${f.cta.badge}</div>
    <div class="cta-title" ondblclick="this.contentEditable=true; this.focus();">${f.cta.title}</div>
    <div class="cta-sub" ondblclick="this.contentEditable=true; this.focus();">${f.cta.sub}</div>
  `;
  container.appendChild(ctaDiv);

  goToStep(0);
}

function goToStep(step) {
  const f = FWS[currentFwIdx];
  currentStep = step;
  if (step > maxUnlockedStep) maxUnlockedStep = step;
  if (step === 6) maxUnlockedStep = 5;

  for (let s = 0; s <= 6; s++) {
    const btn = document.getElementById('btn-step-' + s);
    if (btn) btn.classList.toggle('active', s === step);
  }

  for (let s = 0; s <= 5; s++) {
    const el = document.getElementById('step-node-' + s);
    if (!el) continue;
    el.classList.toggle('locked', s > maxUnlockedStep);
    el.classList.toggle('focused-now', s === step);
  }

  const mobLbl = document.getElementById('mob-step-lbl');
  if (mobLbl) mobLbl.textContent = step === 6 ? 'Mapa todo' : (step + ' / 6');

  const vw = viewportEl.clientWidth;
  const vh = viewportEl.clientHeight;
  const isMob = vw <= 860;
  const singleBoxScale = isMob
    ? Math.min((vw - 24) / 780, (vh - 28) / 580, 1.0)
    : Math.min(vw / 960, vh / 640, 1.32);

  if (step === 0) {
    centerCameraOn(f.center.x, f.center.y, singleBoxScale);
  } else if (step >= 1 && step <= 4) {
    const n = f.nodes[step - 1];
    centerCameraOn(n.x, n.y, singleBoxScale);
  } else if (step === 5) {
    centerCameraOn(f.cta.x, f.cta.y, singleBoxScale);
  } else if (step === 6) {
    const overviewScale = Math.min((vw - 20) / 5400, (vh - 20) / 3900);
    centerCameraOn(3000, 2250, overviewScale);
  }
}

// Touch drag no celular
viewportEl.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  isDragging = true;
  canvasEl.classList.add('dragging');
  startX = e.touches[0].clientX - tx;
  startY = e.touches[0].clientY - ty;
}, { passive: true });
viewportEl.addEventListener('touchmove', (e) => {
  if (!isDragging || e.touches.length !== 1) return;
  e.preventDefault();
  tx = e.touches[0].clientX - startX;
  ty = e.touches[0].clientY - startY;
  applyTransform();
}, { passive: false });
viewportEl.addEventListener('touchend', () => {
  isDragging = false;
  canvasEl.classList.remove('dragging');
});

viewportEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  canvasEl.classList.add('dragging');
  const rect = viewportEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const wx = (mx - tx) / scale;
  const wy = (my - ty) / scale;
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  scale = Math.min(2.2, Math.max(0.16, scale * factor));
  tx = mx - wx * scale;
  ty = my - wy * scale;
  applyTransform();
  clearTimeout(window._wTimer);
  window._wTimer = setTimeout(() => canvasEl.classList.remove('dragging'), 150);
}, { passive: false });

viewportEl.addEventListener('mousedown', (e) => {
  if (e.target.isContentEditable) return;
  isDragging = true;
  canvasEl.classList.add('dragging');
  startX = e.clientX - tx;
  startY = e.clientY - ty;
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  tx = e.clientX - startX;
  ty = e.clientY - startY;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  canvasEl.classList.remove('dragging');
});

window.addEventListener('keydown', (e) => {
  if (e.target.isContentEditable) return;
  if (e.key === 'ArrowRight' || e.code === 'Space') {
    e.preventDefault();
    goToStep((currentStep + 1) <= 6 ? currentStep + 1 : 0);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    goToStep((currentStep - 1) >= 0 ? currentStep - 1 : 0);
  } else if (['0','1','2','3','4','5','6'].includes(e.key)) {
    goToStep(parseInt(e.key, 10));
  } else if (e.key.toLowerCase() === 'h') {
    document.body.classList.toggle('hide-ui');
  } else if (e.key.toLowerCase() === 'd') {
    document.body.classList.toggle('dark');
  }
});

window.addEventListener('resize', () => goToStep(currentStep));

renderTabs();
let initIdx = 0;
if (location.hash) {
  const h = location.hash.slice(1);
  const found = FWS.findIndex((f, i) => f.id === h || String(i) === h);
  if (found >= 0) initIdx = found;
}
loadFW(initIdx);
</script>
</body>
</html>
