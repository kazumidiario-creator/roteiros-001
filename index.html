<script>
const ITEMS = [{"id": "r-001", "num": 1, "group": "1. Novos Modelados (Prontos)", "kind": "pronto", "title": "Essa nova função do Instagram vai falir o TikTok Shop", "note": "Modelagem @finn3v | Microfone de lapela na mão, tom calmo e direto (~70s). Print do @mosseri aos 2s e prints reais no peito (ou tela dividida com o Mapa Mental).", "hook": "Essa nova função do Instagram vai falir o TikTok Shop.", "paras": ["O chefe do Instagram acabou de liberar <strong>links de afiliado da Amazon direto nos Reels</strong> lá nos Estados Unidos, e agora vai todo mundo sair correndo do TikTok Shop achando que encontrou a nova mina de ouro.", "E para ser sincero, dá mesmo para fazer muito dinheiro com isso. Quem ganha pesado nesse modelo nem depende da comissão padrão da Amazon: o pessoal fecha <strong>parceria direta com as empresas que vendem lá dentro</strong> para receber até <strong>100% de comissão</strong>, e a Amazon só serve para rastrear a venda.", "Só que tentar entrar nesse jogo pelo Instagram tem quatro travas pesadas que quase ninguém conta.", "Primeiro: você precisa correr atrás de <strong>fechar parceria direta</strong> com essas marcas americanas na Amazon. Segundo: o custo operacional é alto porque no Instagram você fica refém de <strong>celular físico</strong> para rodar em escala. Terceiro: no Instagram <strong>você não consegue restringir o país de entrega</strong>, então seu vídeo viraliza para um monte de país que não compra. E quarto: como a página da Amazon não fecha a venda sozinha, você precisa produzir <strong>vídeos mais longos e com superprodução</strong> para convencer o cliente.", "É por isso que existe um caminho muito mais simples dentro da própria Meta que quase ninguém enxerga: <strong>o orgânico do Facebook americano</strong>.", "No Facebook, você trava a entrega só para os Estados Unidos direto do computador, <strong>sem precisar de celular físico</strong>. Você não precisa de vídeo longo nem de superprodução, porque um vídeo simples de 20 segundos feito por inteligência artificial só abre a curiosidade, e quem fecha a venda é a página pronta da empresa americana. E você não precisa sair negociando parceria com marca na Amazon, porque já existem ofertas diretas de suplementos físicos pagando <strong>200 dólares por venda</strong>, mais de mil reais limpos no Pix.", "Só em novembro, os membros da Zero Zero Um já passaram de <strong>R$ 1.330.082,75</strong> rodando exatamente isso no Facebook, somando mais de <strong>R$ 2.691.905,87 acumulados</strong>, com um único dia batendo <strong>11 mil dólares e 74 vendas</strong>.", "O Instagram pode até brigar com o TikTok Shop, mas para quem quer ganhar em dólar sem celular físico, sem superprodução e sem depender de parceria na Amazon, o Facebook ainda é o caminho mais rápido. Se você quiser ver essa operação funcionando por dentro, <strong>vai agora no primeiro vídeo fixado aqui do meu perfil</strong>."], "extraTitle": "Cola rápida (Freestyle)", "bullets": ["<strong>Abertura:</strong> Essa nova função do Instagram vai falir o TikTok Shop (Mosseri liberou links da Amazon nos Reels EUA).", "<strong>Como realmente funciona:</strong> dá para ganhar muito, mas não pela comissão padrão da Amazon. A Amazon só rastreia a venda; quem paga até 100% são parcerias diretas com as marcas lá dentro.", "<strong>As 4 travas reais do Instagram + Amazon:</strong> (1) conseguir parceria com marcas na Amazon, (2) custo operacional alto com celular físico, (3) não dá para restringir o país no Instagram, (4) exige vídeos mais longos e com superprodução.", "<strong>A virada (Facebook ODR + Prova):</strong> trava nativa só EUA no PC sem celular físico, vídeo simples de 20s com IA (a página fecha), ofertas prontas pagando US$ 200 (+R$ 1.040). Zero Zero Um: R$ 1.330.082,75 só em novembro e R$ 2.691.905,87 acumulados -&gt; 1º vídeo fixado."]}, {"id": "r-002", "num": 2, "group": "1. Novos Modelados (Prontos)", "kind": "pronto", "title": "Nunca foi tão fácil fazer dinheiro em dólar (e nunca teve tanta distração)", "note": "Modelagem @mazbomiguel | Setup escuro com o ZERUM no monitor atrás, cortes secos a cada 2 a 4 segundos (~38s).", "hook": "Nunca foi tão fácil fazer dinheiro em dólar, mas também nunca teve tanta distração assim.", "paras": ["Você tem hoje na sua tela o que qualquer empresário dos anos 90 pagaria milhões para ter: <strong>inteligência artificial gerando vídeos de 20 segundos em inglês</strong> que vendem produtos físicos nos Estados Unidos pagando <strong>200 dólares por venda</strong>, mais de mil reais, sem você aparecer.", "Só que a maioria usa exatamente o mesmo celular para ficar duas horas por noite rolando Reels.", "E isso nem é fraqueza sua. O seu feed, as séries e os shorts foram construídos por <strong>engenheiros muito mais bem pagos que você</strong> com um único objetivo: te manter preso ali.", "Enquanto isso, a cada hora que você entrega para o feed, tem gente comum usando essa mesma tecnologia para te passar em silêncio. Só em novembro, quem está na Zero Zero Um já passou de <strong>1,3 milhão de reais em vendas</strong>, somando mais de <strong>2,6 milhões acumulados</strong>.", "Se você cansou de ficar só assistindo e quer jogar do outro lado dessa tela, <strong>vai no primeiro vídeo fixado aqui do meu perfil</strong>."], "extraTitle": "Cola rápida (Freestyle)", "bullets": ["<strong>Paradoxo:</strong> nunca foi tão fácil fazer dinheiro em dólar, mas também nunca teve tanta distração assim.", "<strong>Anos 90 vs. Hoje:</strong> IA fazendo vídeos de 20s em inglês que pagam US$ 200 por venda sem aparecer vs. maioria rolando Reels à noite.", "<strong>Vilão real:</strong> não é fraqueza sua, engenheiros muito mais bem pagos criaram o feed só para te segurar ali.", "<strong>Prova + Fecho:</strong> enquanto você rola, a Zero Zero Um já passou de R$ 1,3M só em novembro e R$ 2,6M acumulados -&gt; 1º vídeo fixado."]}, {"id": "r-003", "num": 3, "group": "1. Novos Modelados (Prontos)", "kind": "pronto", "title": "Quem dominar isso aqui vai sair na frente de todo mundo em 2027", "note": "Modelagem @gabrielbuzzi | Sentado mais embaixo (espaço limpo acima da cabeça para textos e prints), camiseta preta, lapela na mão, tela do ZERUM no canto atrás (~48s).", "hook": "Quem dominar isso aqui vai sair na frente de todo mundo em 2027.", "paras": ["Hoje eu opero dezenas de páginas vendendo produtos físicos em dólar nos Estados Unidos e na Europa <strong>sozinho, sem editor e sem equipe</strong>, porque quem faz o trabalho pesado são os meus <strong>agentes de inteligência artificial</strong>.", "Hoje quase ninguém usa inteligência artificial de verdade. A maioria ainda abre o ChatGPT só para escrever textinho.", "<strong>Agente é outra coisa.</strong> É a inteligência artificial trabalhando sozinha o dia inteiro dentro da sua operação.", "Os meus mineram o que está vendendo nos Estados Unidos, criam <strong>até 300 vídeos curtos de 20 segundos por dia</strong> em inglês e alemão, publicam nas páginas no automático e ainda soltam o link de <strong>200 dólares por venda</strong> assim que o vídeo bate 2 mil visualizações.", "Eu posso sair no meio da tarde, dar uma volta de moto ou almoçar em paz com a minha esposa, porque eu sei que os meus agentes continuam rodando a operação em dólar o tempo inteiro.", "Quem dominar isso vai produzir sozinho como uma equipe inteira e faturar em moeda forte. Só em novembro, quem usa essa estrutura na Zero Zero Um já passou de <strong>R$ 1.330.082,75</strong> em vendas, somando mais de <strong>R$ 2,6 milhões acumulados</strong>. Quem deixar para depois vai correr atrás do prejuízo.", "Por isso eu deixei uma aula mostrando exatamente como usar inteligência artificial com agentes para rodar sua operação em dólar. Se você quer sair na frente em 2027, <strong>comenta GRUPO aqui embaixo</strong> que eu te mando o acesso."], "extraTitle": "Cola rápida (Freestyle) + O que sobe acima da cabeça na edição", "bullets": ["<strong>00s a 08s (Gancho + Prova Pessoal):</strong> Sair sse mercado funciona."], "extraTitle": "4 Variações de Gancho (Lateralizações L1 a L4)", "bullets": ["<strong>L1: eixo &quot;a conta&quot; (número no gancho):</strong> &quot;40 milhões de views pagam mais ou menos 15 mil reais. Um vídeo meu de 8 mil views pagou 33.&quot; &quot;Deixa eu te mostrar por quê.&quot; <em>Tela:</em> os dois números lado a lado em texto grande, sem vídeo ainda.", "<strong>L2: eixo &quot;a acusação&quot; (tensão moral, sem moralismo):</strong> &quot;Esse vídeo aqui era uma pessoa real. Trocaram ela por um personagem de IA e fizeram 40 milhões.&quot; &quot;Eu faço a mesma coisa. A diferença é para onde eu aponto.&quot; <em>Tela:</em> PiP do antes/depois. Você assume a técnica logo no gancho: é o gancho mais arriscado e provavelmente o mais forte.", "<strong>L3: eixo &quot;o vendedor de curso&quot; (ataque ao modelo):</strong> &quot;Toda vez que alguém te ensina a ganhar dinheiro com view, pergunta uma coisa: por que ele está vendendo curso?&quot; &quot;Eu te ensino de graça em 10 segundos e no final te mostro de onde o dinheiro sai de verdade.&quot; <em>Tela:</em> você de cara, prints de página de venda borrados entrando como PiP.", "<strong>L4: eixo &quot;o vídeo feio&quot; (curiosidade pela contradição):</strong> &quot;Esse vídeo aqui é horroroso. 20 segundos, sem edição, personagem tosco.&quot; &quot;E ele paga mais que aquele de 40 milhões de views. Deixa eu te mostrar.&quot; <em>Tela:</em> abre com o vídeo ODR feio ocupando a tela inteira, sem você. Você entra no segundo 5."]}, {"id": "r-032", "num": 32, "group": "4. Lotes 01, 02 e 06: Clássicos (5)", "kind": "pronto", "title": "Lote 02 · R1: ORDEM ERRADA (≈75s)", "note": "Lote 02 | Engenharia Reversa (Produto -> Público -> Avatar).", "hook": "Você escolheu o avatar primeiro. É por isso que o seu vídeo não vende. Não é o avatar que está ruim. É a ordem.", "paras": ["<strong>[O erro <span class=\"hl\">8-18s</span>]</strong> Todo mundo faz assim: acha um avatar bonito, depois corre atrás de um produto para ele vender, e só no final descobre para quem estava falando. Isso é de trás para frente. E cada etapa errada contamina a seguinte.", "<strong>[Elo 1: Produto <span class=\"hl\">18-32s</span>]</strong> Começa pelo produto. E produto não é o produto. É a dor que ele resolve e o que ele de fato entrega na vida da pessoa. Ninguém compra o limpador. Compra a mesa cheirosa. E aqui está a parte que quase ninguém entende: <strong>você não cria desejo, você canaliza o desejo.</strong> O desejo já existe, você só aponta ele.", "<strong>[Elo 2: Público <span class=\"hl\">32-48s</span>]</strong> Quando você sabe que dor você resolve, o público aparece sozinho. Homem ou mulher. Mais jovem ou mais velho. E repara: isso já te deu a plataforma. Público mais velho está no Facebook. Mais novo, no Instagram. Você não escolheu a rede. A rede foi consequência.", "<strong>[Elo 3: Avatar <span class=\"hl\">48-62s</span>]</strong> Só agora o avatar. E agora ele não é uma escolha, é uma conclusão. O gênero vem do público. A idade vem do público. Até o tom vem do público: se ele fala agressivo ou se ele fala calmo. E é por isso que o avatar bonito não vende: ele foi escolhido antes de existir alguém para quem falar.", "<strong>[Fecho <span class=\"hl\">62-70s</span>]</strong> Com os três de pé, o conteúdo se escreve sozinho: um vídeo para atrair, um para conscientizar, um para jogar na VSL.", "<strong>[CTA <span class=\"hl\">70-78s</span>]</strong> Comenta 001 que eu te mostro essa cadeia inteira montada."], "extraTitle": "Cola rápida (Freestyle)", "bullets": ["<strong>Cadeia lógica:</strong> Produto (dor real) -&gt; Público (onde ele está) -&gt; Avatar (dedução lógica, nunca gosto pessoal)."]}, {"id": "r-033", "num": 33, "group": "4. Lotes 01, 02 e 06: Clássicos (5)", "kind": "pronto", "title": "Lote 02 · R2: LISTA 3 → 1 (≈110s)", "note": "Lote 02 | Engenharia Reversa (Produto -> Público -> Avatar).", "hook": "Esses são os 3 pilares que fazem qualquer vídeo de avatar vender. E eu vou do menos importante para o mais importante. O terceiro é o que todo mundo acha que é o primeiro.", "paras": ["<strong>[Pilar 3: o avatar <span class=\"hl\">10-35s</span>]</strong> Pilar 3: o avatar. E ele é o MENOS importante dos três. Não porque não importa. Porque ele é consequência. Gênero, idade, tom de voz, se ele é agressivo ou tranquilo: nada disso você escolhe no gosto. Tudo isso é resposta de uma pergunta anterior. Se você está travado escolhendo avatar, você está travado no pilar errado.", "<strong>[Pilar 2: o público <span class=\"hl\">35-68s</span>]</strong> Pilar 2: o público. Esse é quem responde o pilar 3. Homem ou mulher. Mais jovem ou mais velho. Só isso já te entrega o avatar inteiro. E te entrega mais uma coisa de graça: a rede. Público mais velho está no Facebook. Mais novo está no Instagram. Quem erra esse pilar faz vídeo bom para rede errada e acha que o vídeo é que está ruim.", "<strong>[Pilar 1: o produto <span class=\"hl\">68-96s</span>]</strong> Pilar 1, o mais importante: o produto. E eu não estou falando do produto. Estou falando da dor que ele resolve, do desejo que ele atende, e do que ele de verdade muda na vida de quem compra. Ninguém compra o limpador. Compra a mesa cheirosa. <strong>Você não cria desejo. Você canaliza o desejo.</strong> Se você entendeu isso, os outros dois pilares caem no colo.", "<strong>[Fecho <span class=\"hl\">96-106s</span>]</strong> Produto, público, avatar. Nessa ordem. Aí o conteúdo se escreve sozinho: atrair, conscientizar, e jogar na VSL.", "<strong>[CTA <span class=\"hl\">106-113s</span>]</strong> Comenta 001 que eu te mostro isso montado de ponta a ponta."], "extraTitle": "Cola rápida (Freestyle)", "bullets": ["<strong>Cadeia lógica:</strong> Produto (dor real) -&gt; Público (onde ele está) -&gt; Avatar (dedução lógica, nunca gosto pessoal)."]}, {"id": "r-034", "num": 34, "group": "4. Lotes 01, 02 e 06: Clássicos (5)", "kind": "pronto", "title": "Lote 02 · R3: SÓ O MAIS IMPORTANTE (≈45s)", "note": "Lote 02 | Engenharia Reversa (Produto -> Público -> Avatar).", "hook": "De tudo que faz um vídeo de avatar vender, isso aqui é o mais importante. E não é o avatar. Não é a copy, não é a oferta, não é a ferramenta.", "paras": ["<strong>[O miolo <span class=\"hl\">7-32s</span>]</strong> É saber o que o seu produto realmente resolve. Não o que ele é. O que ele faz na vida de quem compra. Ninguém compra o limpador. Compra a mesa cheirosa. Ninguém compra o suplemento. Compra caber na roupa de novo. E aqui está o pulo: <strong>você não cria desejo, você canaliza o desejo.</strong> O desejo já estava lá antes de você aparecer. Seu trabalho é só apontar ele para o lugar certo.", "<strong>[A consequência <span class=\"hl\">32-40s</span>]</strong> Quando você sabe isso, o público aparece sozinho. E quando o público aparece, o avatar aparece junto: gênero, idade, tom, tudo. Você para de escolher avatar e começa a deduzir avatar.", "<strong>[CTA <span class=\"hl\">40-47s</span>]</strong> Comenta 001 que eu te mando o resto."], "extraTitle": "Cola rápida (Freestyle)", "bullets": ["<strong>Cadeia lógica:</strong> Produto (dor real) -&gt; Público (onde ele está) -&gt; Avatar (dedução lógica, nunca gosto pessoal)."]}, {"id": "r-035", "num": 35, "group": "4. Lotes 01, 02 e 06: Clássicos (5)", "kind": "pronto", "title": "Roteiro 06: Viver como Gringo no Brasil (4 Passos)", "note": "Roteiro 06 (v4 ajustado pelos takes, ~60s) | Sentado mais embaixo apontando para cima da cabeça.", "hook": "Como usar os próximos 4 anos do <strong>governo do amor</strong> para fazer dinheiro em dólar da sua casa e sem aparecer.", "paras": ["Ontem o dólar estava assim, <strong>hoje ele já está assim</strong>. E a bolsa de valores está desse jeito aqui.", "Só que a melhor saída para o Brasil não é o aeroporto: é você <strong>viver como um gringo no Brasil, ganhando em dólar e gastando em real</strong>.", "E olha aqui em cima os <strong>4 passos</strong> de como essa engrenagem funciona na prática:", "<strong>1. Primeiro você escolhe o produto:</strong> você entra em plataformas como a <strong>BuyGoods, a ClickBank ou a Hotmart</strong> e se afilia de graça a um produto americano que paga comissão em dólar.", "<strong>2. Sabendo o que você vai vender, você vai no Google Flow:</strong> lá você usa inteligência artificial para criar vídeos simples em inglês, mostrando uma receita ou uma dica rápida para um problema que a pessoa tem.", "<strong>3. Depois você posta numa página de Facebook:</strong> dentro da sua conta do Facebook você cria uma página e ativa essa configuração aqui de <strong>restrição de país só para os Estados Unidos</strong>, para o seu vídeo aparecer só para americano.", "<strong>4. E o segredo final é a automação de DM do Facebook:</strong> quando o americano comenta no seu vídeo, a automação entrega o seu link de afiliado no direct dele e a página faz a venda em dólar para você.", "Qualquer pessoa consegue abrir conta nessas plataformas hoje e começar.", "Agora, se você quiser acesso aos <strong>produtos exclusivos que mais convertem no orgânico</strong> hoje e que pagam <strong>200 dólares por venda</strong>...", "<strong>Opção CTA 1 (Comentar 001):</strong> &quot;<strong>Comenta 001</strong> aqui embaixo que eu te mando no direct como ter acesso a esses produtos e ao passo a passo completo.", "<strong>Opção CTA 2 (Vídeo Fixado / VSL do Perfil):</strong> &quot;Eu deixei uma aula fixada aqui no topo do meu perfil mostrando toda essa operação por dentro. <strong>Entra no meu perfil agora e assiste o primeiro vídeo fixado.</strong>"], "extraTitle": "Cola de 4 Segundos (Ordem Natural da Venda)", "bullets": ["<strong>Passo 1 (O Produto):</strong> Se afilia em dólar na <strong>BuyGoods, ClickBank ou Hotmart</strong>.", "<strong>Passo 2 (O Vídeo):</strong> Cria no <strong>Google Flow</strong> um vídeo simples em inglês (receita/dica para a dor daquele produto).", "<strong>Passo 3 (O Destino):</strong> Posta numa <strong>Página de Facebook</strong> com restrição de país ligada só para os <strong>Estados Unidos</strong>.", "<strong>Passo 4 (A Entrega):</strong> Liga a <strong>automação de DM do Facebook</strong> para enviar o link quando o americano comentar."]}, {"id": "r-036", "num": 36, "group": "5. Cronograma Semanal EZUS (14)", "kind": "pronto", "title": "Segunda-Feira · O choque de realidade CLT/Buzão vs. Faturar em dólar no quarto.", "note": "Post 1 (Manhã) · Reels · Topo de Funil (60%) | POV / Tela Dividida (Luz baixa no quarto).", "hook": "Meu tio se gaba que o filho ganha R$ 4.500 como gerente de firma acordando às 5 da manhã...", "paras": ["<em>&quot;...E ele não entende por que eu nunca saio do quarto e cai R$ 50 mil na minha conta. Não é mágica, não é aposta. Eu coloco inteligência artificial para postar vídeos curtos de 20 segundos lá para os Estados Unidos. O americano compra, a comissão de US$ 200 pinga em dólar e eu não precisei pisar num ônibus lotado há anos.&quot;</em>", "<strong>CTA:</strong> <em>&quot;Comenta GRUPO que eu te mando o acesso às minhas aulas ao vivo no direct ou assiste ao primeiro vídeo fixado do perfil.&quot;</em>"], "extraTitle": "Congruência 3s + Direção Visual", "bullets": ["<strong>Gancho Visual (0 a 3s):</strong> Sentado no PC no escuro com luz de led azul/quente, mexendo no teclado, enquanto na parte superior passa vídeo real de metrô/ônibus lotado às 6h da manhã.", "<strong>Texto na Tela (máx. 9 palavras):</strong> <span class=\"hl\">Enquanto eles pegam 2h de trânsito todo dia...</span>", "<strong>Ideia Central:</strong> O choque de realidade CLT/Buzão vs. Faturar em dólar no quarto."]}, {"id": "r-037", "num": 37, "group": "5. Cronograma Semanal EZUS (14)", "kind": "pronto", "title": "Segunda-Feira · A matemática brutal de tentar escalar em Real vs. vender suplementos em...", "note": "Post 2 (Noite) · Carrossel Dualidade (ou Reel Comparativo) · Topo de Funil (60%) | Carrossel Dualidade (5 lâminas) ou Reel Freestyle apontando para cima.", "hook": "Tem gente que gasta três horas por dia num ônibus lotado para ganhar R$ 2.500, e tem gente que usa uma hora à noite para fazer US$ 200 em uma venda.", "paras": ["<strong>Lâmina 2:</strong> <em>&quot;No Brasil: 1 mês ralando de segunda a sábado para sobrar R$ 500 no final do mês.&quot;</em>", "<strong>Lâmina 3:</strong> <em>&quot;Na gringa: 1 única venda de suplemento nos EUA te paga US$ 200 de comissão limpa (mais de R$ 1.040 no Pix).&quot;</em>", "<strong>Lâmina 4:</strong> <em>&quot;No Brasil você precisa de 200 vendas de R$ 50 para bater R$ 10 mil. Nos EUA, com apenas 9 vendas no mês inteiro você já bateu R$ 10.000.&quot;</em>", "<strong>Lâmina 5:</strong> <em>&quot;A internet brasileira te ensinou a competir com 100 mil afiliados brigando por migalhas. O jogo de verdade está em jogar em dólar sem aparecer.&quot;</em>", "<strong>CTA:</strong> <em>&quot;Qual dos dois lados você escolhe jogar em 2026? Comenta GRUPO aqui embaixo ou veja o 1º post fixado.&quot;</em>"], "extraTitle": "Congruência 3s + Direção Visual", "bullets": ["<strong>Gancho Visual (0 a 3s):</strong> Tela dividida comparando rotina exaustiva no Brasil vs. operação enxuta no computador.", "<strong>Texto na Tela (máx. 9 palavras):</strong> <span class=\"hl\">A diferença entre quem trabalha 12h e quem escala.</span>", "<strong>Ideia Central:</strong> A matemática brutal de tentar escalar em Real vs. vender suplementos em dólar nos EUA."]}, {"id": "r-038", "num": 38, "group": "5. Cronograma Semanal EZUS (14)", "kind": "pronto", "title": "Terça-Feira · Destruir a objeção número 1 do público frio (achar que precisa falar...", "note": "Post 1 (Manhã) · Reels · Topo de Funil (60%) | Talking Head no setup mostrando um vídeo em inglês/alemão rodando no ZERUM.", "hook": "O maior erro do brasileiro é achar que precisa ser fluente em inglês para faturar em dólar...", "paras": ["<em>&quot;Você não vai conversar com nenhum americano no WhatsApp. Você não vai dar suporte. A nossa ferramenta de inteligência artificial já escreve o roteiro validado, gera a voz nativa sem sotaque e monta o vídeo de 20 segundos em menos de 2 minutos. Eu mesmo tenho página batendo 25 mil visualizações na Alemanha sem falar uma palavra de alemão. O seu único trabalho é apertar o botão de publicar na página configurada para os Estados Unidos.&quot;</em>", "<strong>CTA:</strong> <em>&quot;Comenta GRUPO aqui para assistir à minha próxima aula ao vivo ou vai no primeiro vídeo fixado do perfil.&quot;</em>"], "extraTitle": "Congruência 3s + Direção Visual", "bullets": ["<strong>Gancho Visual (0 a 3s):</strong> Mostrando o celular com um vídeo de receitinha natural falando em inglês perfeito e virando para a tela do ZERUM no PC.", "<strong>Texto na Tela (máx. 9 palavras):</strong> <span class=\"hl\">Você não precisa saber uma palavra de inglês.</span>", "<strong>Ideia Central:</strong> Destruir a objeção número 1 do público frio (achar que precisa falar inglês para vender nos EUA)."]}, {"id": "r-039", "num": 39, "group": "5. Cronograma Semanal EZUS (14)", "kind": "pronto", "title": "Terça-Feira · A história real do Método *Ducha e Rua* criado por um aluno de Portugal...", "note": "Post 2 (Noite) · Carrossel Tweet (ou Reel Storytelling) · Meio de Funil (30%) | Carrossel estilo Tweet ou Reel contando o bastidor do Discord.", "hook": "Um aluno meu de Portugal ficou com preguiça de criar vídeo novo, subiu o mesmo arquivo, foi tomar uma ducha e voltou com 10 mil reais.", "paras": ["<em>&quot;A gente batizou isso dentro da Comunidade 001 de Método Ducha e Rua. Ele tinha um vídeo curto de 20 segundos que já tinha batido muitas visualizações nos Estados Unidos, o que a gente chama de vídeo outlier. Em vez de criar outro do zero, ele baixou o mesmo arquivo MP4, repostou na página, foi tomar banho e saiu para a rua. Quando voltou, o vídeo tinha explodido de novo para uma nova fatia do algoritmo americano e gerou R$ 10 mil em comissões de US$ 200. Hoje nossos alunos somam mais de R$ 50 mil por dia aplicando esse processo.&quot;</em>", "<strong>CTA:</strong> <em>&quot;Quer aprender a encontrar um vídeo outlier nos EUA? Comenta GRUPO aqui embaixo ou assiste ao primeiro fixado.&quot;</em>"], "extraTitle": "Congruência 3s + Direção Visual", "bullets": ["<strong>Gancho Visual (0 a 3s):</strong> Print da mensagem do aluno no Discord + reação do Rodrigo na câmera.", "<strong>Texto na Tela (máx. 9 palavras):</strong> <span class=\"hl\">O método bizarro que fez meu aluno faturar 10k.</span>", "<strong>Ideia Central:</strong> A história real do Método <em>Ducha e Rua</em> criado por um aluno de Portugal da Comunidade 001."]}, {"id": "r-040", "num": 40, "group": "5. Cronograma Semanal EZUS (14)", "kind": "pronto", "title": "Quarta-Feira · A história real da mesa de caixa de papelão e da cadeira rasgada de R$...", "note": "Post 1 (Manhã) · Reels · Topo/Meio de Funil (60%) | Jornada do Herói / Contraste Físico Real no Quarto.", "hook": "Essa cadeira toda rasgada de 200 reais aqui foi onde eu passei 14 horas por dia sem ter 10 reais no bolso...", "paras": ["<em>&quot;Eu guardei essa cadeira arrebentada até hoje aqui em casa para nunca esquecer de onde eu saí. Quando eu comecei, minha mesa era literalmente uma caixa de papelão. Muita gente olha hoje a nossa comunidade passando de 2 milhões de reais em vendas, vê eu comprando uma cadeira de 8 mil reais, dando moto para a minha esposa, e acha que ganhar em dólar foi sorte. Não existe dinheiro fácil, irmão. O que existe é parar de dar desculpa, sentar na cadeira e usar a alavanca certa: colocar a inteligência artificial para vender produtos de 200 dólares nos Estados Unidos.&quot;</em>", "<strong>CTA:</strong> <em>&quot;Se você não tem medo de trabalhar para mudar a história da sua família, assiste ao primeiro vídeo fixado aqui do meu perfil.&quot;</em>"], "extraTitle": "Congruência 3s + Direção Visual", "bullets": ["<strong>Gancho Visual (0 a 3s):</strong> Rodrigo batendo a mão na espuma rasgada da cadeira velha de R$ 200 ao lado de uma caixa de papelão e depois girando a câmera para o setup atual com a cadeira de R$ 8.000.", "<strong>Texto na Tela (máx. 9 palavras):</strong> <span class=\"hl\">De uma mesa de papelão até 2 milhões faturados.</span>", "<strong>Ideia Central:</strong> A história real da mesa de caixa de papelão e da cadeira rasgada de R$ 200 que o Rodrigo guardou até hoje vs. a cadeira nova de R$ 8.000 e os R$ 2 milhões da comunidade."]}, {"id": "r-041", "num": 41, "group": "5. Cronograma Semanal EZUS (14)", "kind": "pronto", "title": "Quarta-Feira · Selando um bife ancho/chorizo na frigideira enquanto explica de forma...", "note": "Post 2 (Noite) · Reels · Meio de Funil (30%) | Culinária & Negócios (Vida Real + Analogia de Direct Response).", "hook": "Meu nutricionista passou frango na dieta, mas como aqui em casa só tinha bife ancho, enquanto eu selo essa carne vou te explicar como a gente vende em dólar...", "paras": ["<em>&quot;A galera acha que para ganhar em dólar nos Estados Unidos precisa de uma estrutura mirabolante. Na verdade é igual fazer um corte nobre: se o ingrediente é bom, você só precisa de sal grosso e fogo alto. Na nossa operação, o ingrediente bom é um suplemento americano validado que já paga 200 dólares de comissão por venda, mais de mil reais. O sal grosso é o vídeo simples de 20 segundos de receitinha natural que o ZERUM cria em inglês com um clique. E o fogo alto é o alcance gratuito do Facebook americano. Sem aparecer, sem falar inglês e sem inventar moda.&quot;</em>", "<strong>CTA:</strong> <em>&quot;Enquanto a carne descansa aqui na tábua, vai lá no primeiro vídeo fixado do meu perfil que eu deixei a receita completa da operação.&quot;</em>"], "extraTitle": "Congruência 3s + Direção Visual", "bullets": ["<strong>Gancho Visual (0 a 3s):</strong> Rodrigo na cozinha colocando um bife ancho alto para selar na frigideira quente (barulho da carne chiando nos primeiros 3s).", "<strong>Texto na Tela (máx. 9 palavras):</strong> <span class=\"hl\">Como montar um funil em dólar cozinhando nhã - Postar antes das 12h) · Reels · Fundo de Funil (10%) | Fundo de Funil na Tela do PC (Painel de R$ 2M + Vídeo de 20s no celular).", "hook": "Se você quer fazer a sua primeira venda de 200 dólares ainda este mês sem aparecer e sem falar inglês, presta atenção nos próximos 30 segundos...", "paras": ["<em>&quot;Nós abrimos essa operação no dia 10 de setembro e os alunos da Comunidade 001 acabaram de passar de 2 milhões de reais em vendas, sendo 700 mil só nos últimos 14 dias. E eles não fazem isso editando vídeo de cinema: eles usam o ZERUM para gerar vídeos simples de 20 segundos como esse aqui na minha mão, divulgando suplementos naturais nos Estados Unidos que pagam 200 dólares por venda. Uma única venda coloca mais de mil reais no seu bolso e já paga meses da sua estrutura.&quot;</em>", "<strong>CTA:</strong> <em>&quot;Eu deixei uma aula direta no primeiro vídeo fixado aqui do meu perfil mostrando como entrar na nossa Comunidade Gratuita e participar da próxima aula ao vivo. Comenta GRUPO aqui embaixo que eu te mando o link no direct.&quot;</em>"], "extraTitle": "Congruência 3s + Direção Visual", "bullets": ["<strong>Gancho Visual (0 a 3s):</strong> Rodrigo mostrando na tela do PC o painel oficial de R$ 2.048.036,41 e no celular um vídeo simples de 20s de receitinha natural.", "<strong>Texto na Tela (máx. 9 palavras):</strong> <span class=\"hl\">Quer fazer sua primeira venda em dólar?</span>", "<strong>Ideia Central:</strong> Chamada direta de conversão mostrando os R$ 2.048.036,41 faturados pelos alunos em 65 dias e convidando para dar o primeiro passo."]}, {"id": "r-045", "num": 45, "group": "5. Cronograma Semanal EZUS (14)", "kind": "pronto", "title": "Sexta-Feira · POV de humor com a moto Kawasaki Ninja ZX-4RR na garagem: vizinhos...", "note": "Post 2 (Noite) · Reels · Topo de Funil (60%) | POV Humor / Lifestyle Real (8 a 15 segundos).", "hook": "A cara dos meus vizinhos me vendo comprar uma moto zero na concessionária sem nunca sair do quarto para trabalhar...", "paras": ["<em>&quot;Eles me veem em casa segunda-feira às 10 da manhã, nunca me viram pegar um ônibus às 6h e não entendem nada quando chega uma Ninja na garagem. Mal sabem eles que, enquanto o bairro inteiro dorme, nossos agentes de inteligência artificial estão postando vídeos curtos de 20 segundos em inglês para os Estados Unidos e pingando comissões de 200 dólares, mais de mil reais por venda, direto no computador do meu quarto.&quot;</em>", "<strong>CTA:</strong> <em>&quot;Quer descobrir o que realmente roda nas telas do meu quarto? Assiste ao primeiro vídeo fixado aqui do meu perfil.&quot;</em>"], "extraTitle": "Congruência 3s + Direção Visual", "bullets": ["<strong>Gancho Visual (0 a 3s):</strong> Rodrigo na garagem ligando ou subindo na Ninja ZX-4RR com corte rápido para a tela do quarto cheia de agentes de IA trabalhando.", "<strong>Texto na Tela (máx. 9 palavras):</strong> <span class=\"hl\">Pov: seus vizinhos acham que você vende drogas.</span>", "<strong>Ideia Central:</strong> POV de humor com a moto Kawasaki Ninja ZX-4RR na garagem: vizinhos achando suspeito um jovem comprar uma moto de R$ 40 mil+ sem nunca sair de casa às 6h da manhã."]}, {"id": "r-046", "num": 46, "group": "5. Cronograma Semanal EZUS (14)", "kind": "pronto", "title": "Sábado · A história real mais forte do Rodrigo (destacada pela Annie e pelo Pablo...", "note": "Post 1 (Manhã) · Reels · Topo/Meio de Funil (60%) | Storytelling Real / Emoção + Virada Financeira (com cortes das fotos/vídeos reais do casamento).", "hook": "Eu pedi minha mulher em casamento na frente de 3 mil pessoas sem ter 1 real na conta para pagar o cartório...", "paras": ["<em>&quot;Os meses foram passando, os negócios que eu tentava no Brasil travaram e, faltando 30 dias para a data do casamento, eu estava completamente quebrado. Eu tinha duas opções: cancelar o sonho da mulher da minha vida ou achar uma alavanca de verdade. Eu parei de tentar vender produtinho barato em Real e foquei 100% no mercado americ  e <strong>quem fecha a venda é a VSL</strong>.", "<strong>O erro que a maioria comete:</strong> Tentar convencer, educar e explicar o produto inteiro dentro de um Reel curto, entregando o ouro antes do clique.", "<strong>A virada no vídeo:</strong> Se o vídeo responde todas as perguntas, a pessoa curte, fecha o aplicativo e não compra. O vídeo só abre a porta; a presell e a VSL fazem o trabalho pesado."], "extraTitle": "Opções de Headline / Gancho", "bullets": ["<strong>Headline opção 1:</strong> Por que tentar vender dentro do vídeo é o que está matando as suas comissões em dólar", "<strong>Headline opção 2:</strong> Como um vídeo de 20 segundos que não explica o produto colocou R$ 33.697,25 no bolso em um dia", "<strong>Headline opção 3:</strong> A regra de ouro dos vídeos de IA nos Estados Unidos: o vídeo abre, a página fecha"]}, {"id": "r-068", "num": 68, "group": "8. 10 Teses Técnicas Reais (10)", "kind": "ideia", "title": "02. A Ordem Certa: Produto, Público e Avatar", "note": "Meio de Funil Técnico Real | Engenharia verdadeira da operação ODR (evita conteúdo técnico raso).", "hook": "Você começou pelo avatar de IA e é exatamente por isso que o seu vídeo não vende", "paras": ["<strong>Tese real:</strong> Começar escolhendo um <strong>avatar bonito de IA</strong> para depois procurar o que vender é montar a operação <strong>de trás para frente</strong>; como você não cria desejo na internet e sim <strong>canaliza um desejo que já existe</strong>, a ordem certa é definir primeiro a <strong>dor que o produto resolve</strong>, descobrir qual <strong>público sente essa dor</strong> e em qual rede ele está, e só no final deduzir o rosto, a idade e o tom do avatar.", "<strong>O erro que a maioria comete:</strong> Ficar horas gerando personagem bonito no computador sem saber para quem vai falar nem qual problema vai resolver.", "<strong>A virada no vídeo:</strong> Ninguém compra o limpador, compra a mesa cheirosa. Quando você parte do produto, o público aparece sozinho (mais velho no Facebook, mais novo no Instagram), e o avatar deixa de ser escolha de gosto para virar conclusão lógica."], "extraTitle": "Opções de Headline / Gancho", "bullets": ["<strong>Headline opção 1:</strong> Você começou pelo avatar de IA e é exatamente por isso que o seu vídeo não vende", "<strong>Headline opção 2:</strong> Os 3 pilares de um vídeo que vende em dólar, do menos importante para o mais importante", "<strong>Headline opção 3:</strong> Pare de escolher avatar no gosto pessoal e comece a deduzir o avatar pelo comprador"]}, {"id": "r-069", "num": 69, "group": "8. 10 Teses Técnicas Reais (10)", "kind": "ideia", "title": "03. Gente Normal Vende Mais que Modelo", "note": "Meio de Funil Técnico Real | Engenharia verdadeira da operação ODR (evita conteúdo técnico raso).", "hook": "Por que um vídeo feio de 20 segundos com um avatar comum vende mais que uma superprodução de IA", "paras": ["<strong>Tese real:</strong> Fazer um vídeo de IA com <strong>estética de cinema e rosto de modelo perfeita</strong> parece profissional para você, mas ativa o <strong>radar de propaganda</strong> e afasta quem passa o cartão; o que converte em volume é usar <strong>avatares de pessoas comuns</strong> em cenários domésticos reais, porque o comprador americano não compra de quem parece um comercial de TV, ele compra de quem gera <strong>identificação imediata no primeiro segundo</strong>.", "<strong>O erro que a maioria comete:</strong> Achar que quanto mais bonito, cinematográfico e editado for o avatar, mais ele vai vender.", "<strong>A virada no vídeo:</strong> Construir marca pede estética perfeita; resposta direta no orgânico pede gente como a gente (a enfermeira comum, a senhora na cozinha americana, o homem de 55 anos no quintal)."], "extraTitle": "Opções de Headline / Gancho", "bullets": ["<strong>Headline opção 1:</strong> Por que um vídeo feio de 20 segundos com um avatar comum vende mais que uma superprodução de IA", "<strong>Headline opção 2:</strong> O erro de usar avatares perfeitos demais quando você quer vender para americanos", "<strong>Headline opção 3:</strong> Como criar um personagem de IA que não parece anúncio e passa confiança no primeiro segundo"]}, {"id": "r-070", "num": 70, "group": "8. 10 Teses Técnicas Reais (10)", "kind": "ideia", "title": "04. Conteúdo Autossegmentativo", "note": "Meio de Funil Técnico Real | Engenharia verdadeira da operação ODR (evita conteúdo técnico raso).", "hook": "Como fazer o seu vídeo encontrar o comprador americano sozinho sem gastar 1 real em anúncio", "paras": ["<strong>Tese real:</strong> Viralizar para <strong>milhões de curiosos aleatórios</strong> não coloca dinheiro no bolso se quem assistiu não tem perfil de comprador; quando você opera <strong>sem tráfego pago</strong>, o próprio vídeo precisa <strong>segmentar o público sozinho nos primeiros 3 segundos</strong> através da cena, da idade do personagem e da dor falada no gancho, filtrando quem só quer entretenimento e segurando na tela apenas quem tem o problema e o cartão na mão.", "<strong>O erro que a maioria comete:</strong> Comemorar milhões de visualizações de adolescentes brasileiros ou curiosos que nunca vão comprar um produto de US$ 200.", "<strong>A virada no vídeo:</strong> Sem gerenciador de anúncios, o seu criativo é a segmentação. Bandeira americana ou cozinha típica ao fundo, personagem da mesma faixa etária do comprador e gancho direto no mecanismo filtram a audiência de graça."], "extraTitle": "Opções de Headline / Gancho", "bullets": ["<strong>Headline opção 1:</strong> Como fazer o seu vídeo encontrar o comprador americano sozinho sem gastar 1 real em anúncio", "<strong>Headline opção 2:</strong> Por que 8 mil visualizações das pessoas certas pagam mais que 40 milhões de views de curiosos", "<strong>Headline opção 3:</strong> Os 3 elementos visuais que fazem um vídeo orgânico segmentar quem tem dinheiro no primeiro segundo"]}, {"id": "r-071", "num": 71, "group": "8. 10 Teses Técnicas Reais (10)", "kind": "ideia", "title": "05. Modelagem Científica: O Que Não Muda vs. O Que Muda", "note": "Meio de Funil Técnico Real | Engenharia verdadeira da operação ODR (evita conteúdo técnico raso).", "hook": "Como copiar a estrutura de um vídeo que já vende em dólar sem estragar o que faz ele funcionar", "paras": ["<strong>Tese real:</strong> Copiar um vídeo viral <strong>mudando a fala e o argumento central</strong> achando que está sendo criativo é destruir exatamente o que fez aquele vídeo vender; para modelar de forma científica, você precisa <strong>congelar a copy e o mecanismo</strong> como uma coluna vertebral intocável e girar apenas as <strong>variáveis visuais ao redor</strong>, como quem aplica, o cenário e o avatar, criando um arquivo novo para o algoritmo sem perder o gatilho psicológico que já foi validado.", "<strong>O erro que a maioria comete:</strong> Alterar a frase dos primeiros 3 segundos e o mecanismo do produto ao mesmo tempo em que troca o avatar, ficando cego sem saber por que o vídeo flopou.", "<strong>A virada no vídeo:</strong> Se você muda duas variáveis ao mesmo tempo, não existe teste. A fala que já provou que retém e vende fica 100% travada; o que gira é a cena."], "extraTitle": "Opções de Headline / Gancho", "bullets": ["<strong>Headline opção 1:</strong> Como copiar a estrutura de um vídeo que já vende em dólar sem estragar o que faz ele funcionar", "<strong>Headline opção 2:</strong> O método da coluna vertebral para acertar vídeos virais nos Estados Unidos sem depender da sorte", "<strong>Headline opção 3:</strong> O que você nunca pode mudar quando vai modelar um vídeo vencedor com inteligência artificial"]}, {"id": "r-072", "num": 72, "group": "8. 10 Teses Técnicas Reais (10)", "kind": "ideia", "title": "06. Como Transformar 1 Vídeo Viral em 10 (Lateralização Real)", "note": "Meio de Funil Técnico Real | Engenharia verdadeira da operação ODR (evita conteúdo técnico raso).", "hook": "Como transformar 1 vídeo validado em 10 vídeos que vendem em dólar sem escrever um roteiro novo", "paras": ["<strong>Tese real:</strong> Achar que escalar um vídeo que deu certo é <strong>só trocar o rosto do avatar</strong> faz você deixar 90% do dinheiro na mesa; quando um formato bate <strong>3 vezes a média da sua página</strong>, antes de inventar outro assunto você precisa <strong>esgotar aquele mesmo formato</strong> mudando a dinâmica interna da cena, colocando duas pessoas interagindo, aplicando em um manequim ou mudando o ambiente, extraindo 10 vídeos vencedores de uma única estrutura validada.", "<strong>O erro que a maioria comete:</strong> Fazer apenas uma variação trocando o cabelo ou o rosto do personagem e já pular para outro formato aleatório.", "<strong>A virada no vídeo:</strong> Trocar o arquivo e o rosto é só o básico para não repetir o mesmo MP4 na rede. A escala real vem de girar quem passa, em quem passa, em quê passa e onde se passa, mantendo o mesmo mecanismo."], "extraTitle": "Opções de Headline / Gancho", "bullets": ["<strong>Headline opção 1:</strong> Como transformar 1 vídeo validado em 10 vídeos que vendem em dólar sem escrever um roteiro novo", "<strong>Headline opção 2:</strong> Por que trocar só o rosto do avatar não é escalar: a lista completa do que variar em um vídeo viral", "<strong>Headline opção 3:</strong> O que fazer no minuto seguinte depois que um vídeo seu bate 3 vezes a média da página"]}, {"id": "r-073", "num": 73, "group": "8. 10 Teses Técnicas Reais (10)", "kind": "ideia", "title": "07. Um Vídeo Isolado Nunca É Teste (Leitura de Piso)", "note": "Meio de Funil Técnico Real | Engenharia verdadeira da operação ODR (evita conteúdo técnico raso).", "hook": "Por que julgar o seu formato por um único vídeo postado está fazendo você jogar dinheiro fora", "paras": ["<strong>Tese real:</strong> Postar um vídeo, ver que deu <strong>200 visualizações e descartar a ideia</strong> achando que o formato é ruim é não entender a matemática do orgânico; um vídeo isolado é só ruído porque o <strong>mesmo formato pode bater 15 views hoje e 30 mil amanhã na mesma página</strong>, então a leitura certa é sempre <strong>julgar por lote</strong>, conhecer o piso de entrega da página e dobrar a aposta exclusivamente no formato que multiplicar esse piso por três.", "<strong>O erro que a maioria comete:</strong> Emocionar com 1 vídeo que foi mal, mudar de produto e página todo dia e testar 20 vezes sem concluir nada 20 vezes.", "<strong>A virada no vídeo:</strong> Cada página tem uma personalidade algorítmica e um piso de visualizações. Você espalha formatos em lote até um dar o sinal de 3x o piso; quando dá o sinal, você para de espalhar e enche a página só com ele."], "extraTitle": "Opções de Headline / Gancho", "bullets": ["<strong>Headline opção 1:</strong> Por que julgar o seu formato por um único vídeo postado está fazendo você jogar dinheiro fora", "<strong>Headline opção 2:</strong> A regra do 3x: como ler o sinal do algoritmo e saber exatamente qual vídeo escalar na sua página", "<strong>Headline opção 3:</strong> Como funciona a matemática de lotes para não depender da sorte no tráfego orgânico americano"]}, {"id": "r-074", "num": 74, "group": "8. 10 Teses Técnicas Reais (10)", "kind": "ideia", "title": "08. Espionagem por Intenção de Compra (Comentários > Views)", "note": "Meio de Funil Técnico Real | Engenharia verdadeira da operação ODR (evita conteúdo técnico raso).", "hook": "Como saber em 10 segundos se um vídeo viral nos Estados Unidos está fazendo dinheiro ou só dando view", "paras": ["<strong>Tese real:</strong> Espionar concorrentes olhando só para <strong>vídeos com milhões de visualizações</strong> faz você modelar entretenimento achando que está modelando vendas; no jogo de resposta direta, a métrica que entrega onde está o dinheiro é a <strong>proporção de comentários digitando a palavra-chave</strong>, porque um vídeo de 30 mil views com <strong>800 pessoas pedindo o link</strong> prova intenção de compra, enquanto 1 milhão de views sem comentário é só vaidade.", "<strong>O erro que a maioria comete:</strong> Filtrar vídeos apenas pelo número bruto de visualizações e copiar vídeos que só geram risada ou curiosidade vazia.", "<strong>A virada no vídeo:</strong> Visualização não paga boleto, quem paga é lead qualificado entrando na DM e abrindo a página de vendas. Os três sinais de um vídeo campeão para modelar são: views acima da média do nicho, o dono da página repetindo o mesmo formato e uma enxurrada de comentários com a palavra do CTA."], "extraTitle": "Opções de Headline / Gancho", "bullets": ["<strong>Headline opção 1:</strong> Como saber em 10 segundos se um vídeo viral nos Estados Unidos está fazendo dinheiro ou só dando view", "<strong>Headline opção 2:</strong> Os 3 sinais que provam que um vídeo gringo está vendendo milhares de dólares todos os dias", "<strong>Headline opção 3:</strong> Pare de olhar para visualizações quando for espionar concorrentes e olhe para esta métrica"]}, {"id": "r-075", "num": 75, "group": "8. 10 Teses Técnicas Reais (10)", "kind": "ideia", "title": "09. Discernimento Externo: Você Não Faz Vídeo Para Você", "note": "Meio de Funil Técnico Real | Engenharia verdadeira da operação ODR (evita conteúdo técnico raso).", "hook": "O erro invisível de criar vídeos para o seu próprio gosto em vez de criar para quem passa o cartão", "paras": ["<strong>Tese real:</strong> Julgar se um vídeo ficou bom usando a <strong>sua própria cabeça de 20 e poucos anos</strong> é o motivo pelo qual o seu conteúdo passa batido por quem tem <strong>55 anos e realmente compra o produto</strong>; produzir vídeo que converte exige desligar o seu gosto pessoal e construir um <strong>discernimento externo</strong>, ajustando a velocidade da fala, a clareza da legenda e a simplicidade da cena para o cérebro do seu comprador, não para o seu.", "<strong>O erro que a maioria comete:</strong> Querer colocar edição frenética, cortes de TikTok e gírias jovens em vídeos feitos para americanos de meia-idade no Facebook.", "<strong>A virada no vídeo:</strong> Você não é o seu cliente. O que parece lento, óbvio ou simples demais para você é exatamente o que faz uma pessoa de 55 anos nos Estados Unidos entender a mensagem, confiar no vídeo e comentar pedindo a receita."], "extraTitle": "Opções de Headline / Gancho", "bullets": ["<strong>Headline opção 1:</strong> O erro invisível de criar vídeos para o seu próprio gosto em vez de criar para quem passa o cartão", "<strong>Headline opção 2:</strong> Por que vídeos simples e diretos vendem muito mais para americanos acima de 50 anos no Facebook", "<strong>Headline opção 3:</strong> Como pensar exatamente com a cabeça do seu comprador nos primeiros 5 segundos de um vídeo"]}, {"id": "r-076", "num": 76, "group": "8. 10 Teses Técnicas Reais (10)", "kind": "ideia", "title": "10. Criatividade Sistemática vs. Inspiração", "note": "Meio de Funil Técnico Real | Engenharia verdadeira da operação ODR (evita conteúdo técnico raso).", "hook": "Como nunca mais travar na hora de produzir vídeos usando o método de criatividade sistemática", "paras": ["<strong>Tese real:</strong> Depender de <strong>inspiração e talento criativo</strong> para tentar inventar um vídeo do zero todo dia é o que trava a sua constância; quem produz em escala substitui criatividade artística por <strong>criatividade sistemática</strong>, alimentando diariamente um <strong>banco de vídeos vencedores desmontados</strong> onde os primeiros 5 segundos, o gancho visual e a chamada já foram testados pelo mercado, precisando apenas encaixar a própria execução dentro de uma engenharia pronta.", "<strong>O erro que a maioria comete:</strong> Sentar na frente do computador em branco tentando ter uma ideia genial ou salvando 200 links numa pasta sem anotar por que cada vídeo funcionou.", "<strong>A virada no vídeo:</strong> Sistema vence talento. Quando você ficha o primeiro frame, a frase dos primeiros 5 segundos e o motivo psicológico que fez o comprador parar stados Unidos."], "extraTitle": "Direção Rápida", "bullets": ["<strong>Formato:</strong> Responder caixinha de perguntas nos Stories/Reels (30 a 45s) puxando para o 1º vídeo fixado."]}, {"id": "r-091", "num": 91, "group": "9. Caixinha por Profissão (15)", "kind": "ideia", "title": "[CLT Normal] Ideia 15: O Passo a Passo Diário para Quem É Totalmente Iniciante", "note": "Topo de Funil · Ajuste de Roda | Perfil alvo: CLT Normal. Ler a pergunta da caixinha na tela e responder direto.", "hook": "Sou totalmente iniciante, não falo inglês, não tenho produto e não sei programar site. O que exatamente eu preciso fazer todo dia?", "paras": ["Hoje a parte técnica inteira é automatizada porque <strong>o produto físico já existe lá fora, a página de vendas sobe pronta em um clique e a IA cria o vídeo em inglês</strong> a partir do seu comando em português; o seu único trabalho diário é <strong>copiar formatos validados e manter a constância de postar todos os dias</strong> até a página tracionar."], "extraTitle": "Direção Rápida", "bullets": ["<strong>Formato:</strong> Responder caixinha de perguntas nos Stories/Reels (30 a 45s) puxando para o 1º vídeo fixado."]}, {"id": "r-092", "num": 92, "group": "10. 10 Perguntas de Desejo (10)", "kind": "ideia", "title": "1. A Barreira do Idioma e Localização", "note": "Lote 08 | Quebra de objeção + desejo pela 001 (Caixinha ou Headline de Reel).", "hook": "Como eu vou vender nos Estados Unidos morando no Brasil se eu não sei falar uma palavra em inglês?", "paras": ["Hoje quem fala inglês não é você, é a <strong>inteligência artificial</strong>.", "Você entra no <strong>Google Flow</strong>, escreve o comando em português e a IA gera o vídeo de um americano falando inglês nativo.", "Depois você posta numa página de Facebook com a <strong>restrição de país ligada só para os Estados Unidos</strong>, bloqueando o Brasil."], "extraTitle": "Ponte para a Zero Zero Um", "bullets": ["<strong>Gancho de desejo pela Zero Zero Um:</strong> Lá dentro da <strong>001</strong>, além de aprender a gerar os vídeos, todas as páginas de vendas e mensagens em inglês já saem prontas em 1 clique, sem você precisar traduzir nada."]}, {"id": "r-093", "num": 93, "group": "10. 10 Perguntas de Desejo (10)", "kind": "ideia", "title": "2. De Onde Saem os Produtos de US$ 200 (Zero Estoque)", "note": "Lote 08 | Quebra de objeção + desejo pela 001 (Caixinha ou Headline de Reel).", "hook": "De onde saem esses produtos que pagam 200 dólares por venda? Eu preciso comprar estoque ou enviar pelo correio?", "paras": ["Você não compra estoque e não encosta em nenhuma caixa.", "São <strong>suplementos físicos americanos</strong> (emagrecimento, saúde, dores): o dono do produto lá nos Estados Unidos fabrica e envia direto para a casa do americano.", "Você encontra produtos assim em plataformas abertas como <strong>BuyGoods, ClickBank e Hotmart</strong>."], "extraTitle": "Ponte para a Zero Zero Um", "bullets": ["<strong>Gancho de desejo pela Zero Zero Um:</strong> Quem está dentro da <strong>001</strong> não precisa garimpar produto no escuro: já recebe acesso direto aos <strong>produtos exclusivos que mais estão convertendo no orgânico hoje</strong>, pagando de <strong>190 a 220 dólares por venda</strong>."]}, {"id": "r-094", "num": 94, "group": "10. 10 Perguntas de Desejo (10)", "kind": "ideia", "title": "3. O Ceticismo sobre a Comissão Alta", "note": "Lote 08 | Quebra de objeção + desejo pela 001 (Caixinha ou Headline de Reel).", "hook": "Por que alguém me pagaria 200 dólares (mais de R$ 1.100) de comissão em uma única venda? Qual é a pegadinha?", "paras": ["Não tem pegadinha, tem <strong>matemática de mercado americano</strong>.", "Nos Estados Unidos, o americano tem o hábito de comprar <strong>kits de 3 a 6 potes de suplemento</strong> de uma vez só no cartão de crédito.", "Como você trouxe esse cliente através de um vídeo orgânico (sem o dono do produto gastar em anúncio caro lá fora), ele repassa <strong>200 dólares limpos de comissão</strong> para você."], "extraTitle": "Ponte para a Zero Zero Um", "bullets": ["<strong>Gancho de desejo pela Zero Zero Um:</strong> É por isso que na <strong>001</strong> a meta de quem começa não é fazer 100 vendas no mês: <strong>uma única venda</strong> já coloca mais de mil e cem reais no bolso."]}, {"id": "r-095", "num": 95, "group": "10. 10 Perguntas de Desejo (10)", "kind": "ideia", "title": "4. Como Vende sem Anúncio e sem Aparecer", "note": "Lote 08 | Quebra de objeção + desejo pela 001 (Caixinha ou Headline de Reel).", "hook": "Se eu não mostro o meu rosto e não pago anúncio, como o americano acha o meu vídeo e compra de mim?", "paras": ["Através de uma engrenagem de <strong>4 passos</strong>:", "<strong>1.</strong> Você posta um vídeo curto de IA dando uma dica ou receita caseira na sua página restrita aos EUA.", "<strong>2.</strong> O vídeo pede para o americano comentar uma palavra se quiser a receita completa.", "<strong>3.</strong> A automação gratuita de DM do Facebook entrega o seu link no direct dele em segundos.", "<strong>4.</strong> O vídeo só abre a curiosidade; <strong>quem faz a venda é a página americana</strong>."], "extraTitle": "Ponte para a Zero Zero Um", "bullets": ["<strong>Gancho de desejo pela Zero Zero Um:</strong> Dentro da <strong>001</strong>, você tem o <strong>Gerador de Estrutura</strong> que monta essa página americana validada em segundos, pronta para converter o clique em comissão em dólar."]}, {"id": "r-096", "num": 96, "group": "10. 10 Perguntas de Desejo (10)", "kind": "ideia", "title": "5. Falta de Tempo (Para quem trabalha no CLT)", "note": "Lote 08 | Quebra de objeção + desejo pela 001 (Caixinha ou Headline de Reel).", "hook": "Eu trabalho o dia inteiro no CLT e só tenho 1 a 2 horas livres à noite. Dá para rodar isso ou precisa ficar o dia todo no computador?", "paras": ["Dá perfeitamente, porque você <strong>não precisa gravar com câmera, não precisa atender cliente no WhatsApp</strong> e quem posta em horários programados é o próprio sistema.", "Com <strong>1 a 2 horas focadas à noite</strong>, você consegue gerar os vídeos com IA e deixar as suas páginas americanas alimentadas."], "extraTitle": "Ponte para a Zero Zero Um", "bullets": ["<strong>Gancho de desejo pela Zero Zero Um:</strong> E para quem tem pouco tempo, dentro da <strong>001</strong> existe o <strong>ZERUM</strong> (gerador automático de vídeos), que cria em minutos os vídeos que levariam horas para fazer na mão."]}, {"id": "r-097", "num": 97, "group": "10. 10 Perguntas de Desejo (10)", "kind": "ideia", "title": "6. Como Saber o que o Americano Gosta de Assistir", "note": "Lote 08 | Quebra de objeção + desejo pela 001 (Caixinha ou Headline de Reel).", "hook": "Como eu vou saber que tipo de vídeo dá certo lá fora se eu nunca fui para os Estados Unidos?", "paras": ["Regra número um desse mercado: <strong>você nunca tenta adivinhar nem inventar nada da sua cabeça</strong>.", "Você usa a <strong>Modelagem</strong>: você olha vídeos que já estão batendo milhares de visualizações lá nos Estados Unidos hoje e recria a mesma estrutura usando um personagem gerado por IA."], "extraTitle": "Ponte para a Zero Zero Um", "bullets": ["<strong>Gancho de desejo pela Zero Zero Um:</strong> Na <strong>001</strong>, você recebe a ferramenta <strong>001 Spy</strong> e o método de transformar <strong>1 vídeo validado em 10 variações</strong>, tirando totalmente o fator sorte do jogo."]}, {"id": "r-098", "num": 98, "group": "10. 10 Perguntas de Desejo (10)", "kind": "ideia", "title": "7. Página Começando do Zero (Sem Seguidores)", "note": "Lote 08 | Quebra de objeção + desejo pela 001 (Caixinha ou Headline de Reel).", "hook": "Se eu criar uma página de Facebook do zero hoje, sem nenhum seguidor, meus vídeos não vão ficar com zero visualizações?", "paras": ["Hoje o algoritmo de vídeos curtos entrega pelo <strong>conteúdo do vídeo</strong>, não pelo número de seguidores da página.", "Uma página recém-criada e aquecida do jeito certo já começa a entregar para americanos nos primeiros dias.", "E você não precisa de milhões de views: na média da operação, <strong>a cada 300 a 400 visitas na página, sai 1 venda de 200 dólares</strong>."], "extraTitle": "Ponte para a Zero Zero Um", "bullets": ["<strong>Gancho de desejo pela Zero Zero Um:</strong> Dentro da <strong>001</strong>, o aluno segue o checklist exato dos primeiros dias para aquecer a página e destravar a entrega nos Estados Unidos sem bater cabeça."]}, {"id": "r-099", "num": 99, "group": "10. 10 Perguntas de Desejo (10)", "kind": "ideia", "title": "8. O \"Ajuste de Roda\" (Para Editor, Gestor, Copywriter e Social Media)", "note": "Lote 08 | Quebra de objeção + desejo pela 001 (Caixinha ou Headline de Reel).", "hook": "Eu já sou editor de vídeo (ou gestor de tráfego / copywriter) aqui no Brasil. Vale a pena trocar os meus clientes em real por isso?", "paras": ["Você não precisa nem largar os seus clientes no primeiro dia, você só precisa fazer um <strong>ajuste de roda</strong>.", "Hoje você já domina a habilidade mais difícil (editar, escrever copy ou analisar métricas), mas vende isso barato em real para aguentar reunião e cobrança de cliente o mês inteiro."], "extraTitle": "Ponte para a Zero Zero Um", "bullets": ["<strong>Gancho de desejo pela Zero Zero Um:</strong> Quando você entra na <strong>001</strong> e aponta essa mesma habilidade para os produtos americanos, <strong>duas vendas de 200 dólares no mês</strong> já colocam mais de R$ 2.200 no seu bolso, sem chefe e sem cliente no seu ouvido."]}, {"id": "r-100", "num": 100, "group": "10. 10 Perguntas de Desejo (10)", "kind": "ideia", "title": "9. Medo de Queimar Dinheiro (Quem já tentou Tráfego Pago ou Drop)", "note": "Lote 08 | Quebra de objeção + desejo pela 001 (Caixinha ou Headline de Reel).", "hook": "Eu já perdi dinheiro tentando rodar anúncio e dropshipping no Brasil. Qual é o risco de eu perder dinheiro nisso também?", "paras": ["No tráfego pago você é obrigado a pagar o Facebook na frente sem saber se o anúncio vai vender; se não vender, o prejuízo é todo seu.", "Aqui o tráfego é <strong>100% orgânico</strong>: criar conta e página no Facebook é grátis, então você pode testar vídeos todos os dias <strong>sem colocar 1 real em anúncios</strong>."], "extraTitle": "Ponte para a Zero Zero Um", "bullets": ["<strong>Gancho de desejo pela Zero Zero Um:</strong> Em vez de queimar R$ 2.000 ou R$ 3.000 testando anúncio sozinho, na <strong>001</strong> você opera com custo fixo baixíssimo usando as ferramentas e produtos que a comunidade já validou."]}, {"id": "r-101", "num": 101, "group": "10. 10 Perguntas de Desejo (10)", "kind": "ideia", "title": "10. Como o Dinheiro em Dólar Cai na Conta no Brasil", "note": "Lote 08 | Quebra de objeção + desejo pela 001 (Caixinha ou Headline de Reel).", "hook": "Quando sai uma venda de 200 dólares lá nos Estados Unidos, como esse dinheiro vira real na minha conta aqui no Brasil?", "paras": ["O processo é totalmente automático: o americano passa o cartão em dólar lá nos Estados Unidos e a sua comissão de <strong>US$ 190 a US$ 220</strong> cai em dólar na sua conta internacional (Payoneer).", "De lá, você transfere direto para a sua conta bancária brasileira via Pix, multiplicando cada dólar pela cotação do dia (mais de <strong>R$ 5,70 para 1</strong>)."], "extraTitle": "Ponte para a Zero Zero Um", "bullets": ["<strong>Gancho de desejo pela Zero Zero Um:</strong> Na <strong>001</strong>, cada venda que sai já apita na tela do seu celular pelo aplicativo da comunidade e em 2 dias a comissão em dólar já é liberada."]}, {"id": "r-102", "num": 102, "group": "11. Virais Nota 10: 7 Beats (8)", "kind": "animacao", "title": "VIRAL #01 · \"De Chinelo na Concessionária\" (Julgamento por Aparência -> Pix à Vista)", "note": "30s · 6 Cenas de 5s · Estilo PS2 ou 3D Pixar | Por que tem altíssimo apelo viral: Ativa o gatilho mais compartilhado do Brasil (o cara simples que ganha em dólar no quarto sem precisar andar de terno e cala a boca do vendedor arrogante, recompensando o funcionário humilde).", "hook": "Vendedor Arrogante: &quot;Ô garoto, o ponto de ônibus é lá na esquina! Essa máquina aqui é só para quem tem dinheiro!&quot;", "paras": ["<strong>Cena 01 (0 a 5s):</strong> Vendedor Arrogante: &quot;Ô garoto, o ponto de ônibus é lá na esquina! Essa máquina aqui é só para quem tem dinheiro!&quot;", "<strong>Cena 02 (5 a 10s):</strong> Vendedor Humilde: &quot;Bom dia, irmão! Não liga para ele não. Quer dar uma olhada nela de perto? Eu te mostro tudo!&quot;", "<strong>Cena 03 (10 a 15s):</strong> Rodrigo: &quot;Gostei do seu respeito, irmão. Pode emitir a nota que eu vou pagar à vista no Pix, e a comissão é toda sua!&quot;", "<strong>Cena 04 (15 a 20s):</strong> Vendedor Arrogante: &quot;Pagamento aprovado à vista?! Mas você tem vinte anos e veio de chinelo! Você trabalha com o quê, moleque?!&quot;", "<strong>Cena 05 (20 a 25s):</strong> Rodrigo: &quot;Eu coloco inteligência artificial para postar vídeos de vinte segundos lá nos Estados Unidos e ganho duzentos dólares por venda!&quot;", "<strong>Cena 06 (25 a 30s):</strong> Rodrigo: &quot;Para quem humilha os outros eu não ensino! Mas para você, deixei tudo no primeiro vídeo fixado aqui do perfil!&quot;"], "extraTitle": "Ação Visual Cena a Cena", "bullets": ["<strong>Cena 01 (0 a 5s) (Visual):</strong> Headline no topo: POV: VOCÊ GANHA EM DÓLAR NO QUARTO E ESQUECE DE TROCAR DE ROUPA PARA SAIR Rodrigo de camiseta preta básica, bermuda e chinelo olhando um carro/moto zero na loja. O vendedor veterano de gravata olha com desprezo de cima a baixo.", "<strong>Cena 02 (5 a 10s) (Visual):</strong> Um vendedor novato humilde se aproxima com respeito enquanto o veterano ri encostado no balcão ao fundo.", "<strong>Cena 03 (10 a 15s) (Visual):</strong> O celular do Rodrigo apita 3 notificações verdes seguidas (+ US$ 200.00 / R$ 1.040,00). Rodrigo sorri calmo e aponta para o vendedor humilde.", "<strong>Cena 04 (15 a 20s) (Visual):</strong> Comprovante a
