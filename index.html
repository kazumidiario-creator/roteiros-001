 verdes de +US$ 200.00 (R$ 1.040 cada) na cara do amigo.", "<strong>Beat 4 · 00:16 a 00:21Choque da Matemática (Cena):</strong> Amigo larga o mouse, levanta da cadeira e olha incrédulo para a tela verde do celular do Rodrigo.", "<strong>Beat 5 · 00:21 a 00:27Mecanismo + B-Roll (Cena):</strong> Rodrigo aponta para a tela + B-Roll do holograma do vídeo curto de suplemento nos Estados Unidos (+US$ 200.00).", "<strong>Beat 6 · 00:27 a 00:30Amigo Implorando (Cena):</strong> Amigo junta as duas mãos implorando para o Rodrigo ao lado da mesa.", "<strong>Beat 7 · 00:30 a 00:39Punchline + Drop 001 (Cena):</strong> Rodrigo olha direto para a câmera apontando para o card &quot;PASSO A PASSO COMPLETO NO 1º VÍDEO FIXADO DO PERFIL&quot; -&gt; Glitch + Drop Logo 001."]}, {"id": "r-110", "num": 110, "group": "12. Animações, PS2 e Faceless (7)", "kind": "animacao", "title": "PS2: \"O Que o Seu Filho Faz Trancado no Quarto?\" (50 mil/mês)", "note": "Estilo PS2 / The Sims 2 (21,3s · 8 Planos) | Opção 1 aprovada em cima + Opção 2 Humor Seco na cola abaixo.", "hook": "POV: SUA MÃE TENTANDO EXPLICAR COM O QUE VOCÊ TRABALHA", "paras": ["<strong>Texto Fixo de Topo (POV):</strong> <span class=\"hl\">POV: SUA MÃE TENTANDO EXPLICAR COM O QUE VOCÊ TRABALHA</span>", "<strong>Plano 01 (00:00 - 00:02.4 · Tia Loira de Pérolas):</strong> <em>&quot;O meu filho acabou de passar em Direito na Federal!&quot;</em>", "<strong>Plano 02 (00:02.4 - 00:04.8 · Tia de Óculos e Coque):</strong> <em>&quot;O meu virou médico cirurgião agora. Trabalha quatorze horas por dia, claro.&quot;</em>", "<strong>Plano 03 (00:04.8 - 00:08.5 · Tia de Cachecol olhando para a Mãe):</strong> <em>&quot;E o seu menino? Vive trancado naquele quarto... O que ele faz?&quot;</em>", "<strong>Plano 04 (00:08.5 - 00:11.6 · Porta abre, boneco PS2 do Rodrigo sai bocejando de camiseta <span class=\"hl\">001</span> e samba-canção):</strong> <em>&quot;Ué... eu faço vídeo de IA para o Facebook lá dos Estados Unidos.&quot;</em>", "<strong>Plano 05 (00:11.6 - 00:14.2 · Ele joga o tijolo de notas de dólar/reais nas mãos da mãe; ela abre o sorriso):</strong>", "<strong>Mãe (orgulhosa):</strong> <em>&quot;E tira cinquenta mil por mês sem nem aparecer.&quot;</em>", "<strong>Plano 06 (00:14.2 - 00:15.8 · As 3 tias de queixo caído derrubando a xícara de café na mesa):</strong> <em>(Som da xícara caindo e café espalhando)</em>", "<strong>Plano 07 (00:15.8 - 00:17.7 · Filho dando meia-volta para a cama):</strong> <em>&quot;A IA já postou os vídeos de hoje, mãe. Vou voltar a dormir.&quot;</em>", "<strong>Plano 08 (00:17.7 - 00:21.3 · Drop da música + Tela do ZERUM / Celular com depósitos de US$ 200 no capô da Porsche/Ferrari):</strong> Texto na tela: <span class=\"hl\">ELE DEU UM EMPREGO PARA A IA · AULA GRATUITA 19/11 ÀS 19H19 NO LINK DA BIO</span>."], "extraTitle": "Opção 2 (Humor Seco \"Sou Desempregado\")", "bullets": ["<strong>Texto Fixo de Topo (POV):</strong> <span class=\"hl\">POV: AS TIAS PERGUNTAM O QUE VOCÊ FAZ TRANCADO NO QUARTO</span>", "<strong>Plano 01 (00:00 - 00:02.4 · Tia Loira):</strong> <em>&quot;O meu filho passou num concurso de dez mil reais!&quot;</em>", "<strong>Plano 02 (00:02.4 - 00:04.8 · Tia de Óculos):</strong> <em>&quot;O meu agora é engenheiro sênior. Sai de casa às seis da manhã todo dia.&quot;</em>", "<strong>Plano 03 (00:04.8 - 00:08.5 · Tia de Cachecol):</strong> <em>&quot;E o seu menino? Nem sai daquele quarto... O que é que ele faz?&quot;</em>", "<strong>Plano 04 (00:08.5 - 00:11.6 · Porta abre, boneco PS2 sai bocejando e coçando as costas):</strong> <em>&quot;Ah... eu sou desempregado.&quot;</em>", "<strong>Plano 05 (00:11.6 - 00:14.2 · Ele coloca o tijolo de dinheiro nas mãos da mãe; a mãe sorri para as tias):</strong>", "<strong>Mãe:</strong> <em>&quot;Ele faz vídeo de IA para o Facebook americano... e ganha cinquenta mil por mês.&quot;</em>", "<strong>Plano 06 (00:14.2 - 00:15.8 · As 3 tias em choque derrubam a xícara de café):</strong> <em>(Som da xícara quebrando)</em>", "<strong>Plano 07 (00:15.8 - 00:17.7 · Filho voltando para o quarto):</strong> <em>&quot;Tudo passa, titias.&quot;</em>", "<strong>Plano 08 (00:17.7 - 00:21.3 · Drop da música + Close final de ostentação/prova):</strong> Notificações reais de <span class=\"hl\">+$200.00</span> pulando na tela + <span class=\"hl\">COMENTA &quot;IA&quot; QUE EU TE MOSTRO COMO FUNCIONA</span>."]}, {"id": "r-111", "num": 111, "group": "12. Animações, PS2 e Faceless (7)", "kind": "animacao", "title": "PS2: O Almoço de Domingo na Casa da Vó", "note": "Animação PS2 (7 cenas · ~30s) | Primos formados se gabando vs. menino do quarto ganhando R$ 50 mil/mês em dólar.", "hook": "Me formei na faculdade! Cinco anos estudando para ganhar quatro mil reais!", "paras": ["<strong>Cena 01 (scene1 -&gt; take01) - 4s (Prima Formada (blazer de escritorio e oculos na mesa da vo)):</strong> &quot;Me formei na faculdade! Cinco anos estudando para ganhar quatro mil reais!&quot;", "<strong>Cena 02 (scene2 -&gt; take02) - 4s (Primo do Escritorio (camisa social azul clara, cracha e olheiras)):</strong> &quot;E eu que fui promovido a supervisor? So pego tres horas de onibus lotado por dia!&quot;", "<strong>Cena 03 (scene3 -&gt; take03) - 4s (Tio de Bigode (camisa polo listrada apontando o garfo)):</strong> &quot;E o seu menino? Vive trancado naquele quarto... O que ele faz?&quot;", "<strong>Cena 04 (scene4 -&gt; take04) - 4s (Rodrigo na geladeira pegando agua tranquilo (polo preta de tricot com ziper)):</strong> &quot;Ue, tio... eu faco video com inteligencia artificial para o Facebook la dos Estados Unidos.&quot;", "<strong>Cena 05 (scene5 -&gt; take05) - 4s (Rodrigo ao lado da Mae orgulhosa (blusa azul) com prova na mesa):</strong> &quot;Ele tira cinquenta mil por mes sem aparecer... e quem trabalha e o robo.&quot;", "<strong>Cena 06 (scene6 -&gt; take06) - 4s (Choque Geral na Mesa (Tio e Primos de queixo caido)):</strong> &quot;(Tio e primos travam de queixo caido; garfo cai no prato e copo vira na toalha xadrez)&quot;", "<strong>Cena 07 (scene7 -&gt; take07) - 6s (Rodrigo no Quarto com os 2 Monitores Rodando IA em Dolar):</strong> &quot;Enquanto eles acham que eu so fico no quarto, a IA trabalha para mim em dolar. Me segue aqui que eu te ensino como fazer isso do zero.&quot;"], "extraTitle": "Cola rápida (Freestyle)", "bullets": []}, {"id": "r-112", "num": 112, "group": "12. Animações, PS2 e Faceless (7)", "kind": "animacao", "title": "PS2: O Churrasco de Domingo (Tio Valdir vs. IA em Casa)", "note": "Animação PS2 (7 cenas · ~38s) | Tio Valdir e primo estagiário vs. Rodrigo cravando R$ 50 mil/mês em casa.", "hook": "O meu filho agora e gerente na firma, sai de casa as seis da manha todo dia! Mas recebe quatro mil e quinhentos por mes, mais beneficio!", "paras": ["<strong>Cena 01 (scene1 -&gt; take01) - 6s (Tio Valdir (56 anos, camisa polo amarela e verde, pegador de churrasco na mao)):</strong> &quot;O meu filho agora e gerente na firma, sai de casa as seis da manha todo dia! Mas recebe quatro mil e quinhentos por mes, mais beneficio!&quot;", "<strong>Cena 02 (scene2 -&gt; take02) - 6s (Primo Cansado (22 anos, camisa polo listrada, cracha de estagiario e olheiras fundas)):</strong> &quot;Eu comecei um estagio novo, pego umas duas horas de transito, mas recebo dois mil reais por mes!&quot;", "<strong>Cena 03 (scene3 -&gt; take03) - 4s (Tio Valdir apontando o garfo tridente para a casa e perguntando para a Mae):</strong> &quot;E o seu menino? Nao sai de casa nunca, vive trancado naquele quarto... Ele trabalha com o que?&quot;", "<strong>Cena 04 (scene4 -&gt; take04) - 6s (Mae (blusa azul simples) tentando explicar do jeito dela na mesa do churrasco):</strong> &quot;Eu nao entendo... So sei que ele bota uns robos no computador para fazer video la para os Estados Unidos.&quot;", "<strong>Cena 05 (scene5 -&gt; take05) - 6s (Rodrigo (camisa de botao florida rosa) chegando tranquilo ao lado da Mae com bolo de notas e celular apitando dolar):</strong> &quot;E cai cinquenta mil por mes na minha conta sem eu sair de casa, tio. A inteligencia artificial faz tudo para mim.&quot;", "<strong>Cena 06 (scene6 -&gt; take06) - 4s (Tio Valdir deixando o pegador cair na grelha e Primo Estagiario em choque):</strong> &quot;(Silencio comico + barulho de pegador batendo na grelha e copo virando)&quot;", "<strong>Cena 07 (scene7 -&gt; take07) - 6s (Rodrigo (camisa de botao florida rosa) no quarto escuro com 2 monitores gerando videos automaticos em dolar):</strong> &quot;Enquanto eles pegam horas de transito todo dia, a inteligencia artificial trabalha para mim, em dolar, sem eu sair de casa. Me segue aqui que eu te ensino como fazer isso do zero.&quot;"], "extraTitle": "Cola rápida (Freestyle)", "bullets": []}, {"id": "r-113", "num": 113, "group": "12. Animações, PS2 e Faceless (7)", "kind": "animacao", "title": "Animação 001: Os 50 Caminhos na Internet (Lançamento vs. Low Ticket vs. ODR)", "note": "Episódio Animação v4 (narrado) | Eliminação lógica dos modelos do Brasil até o orgânico americano em dólar.", "hook": "Você quer ganhar dinheiro na internet e começa a pesquisar. Em dois segundos aparecem cinquenta caminhos diferentes na tela, e você trava sem saber qual escolher. Então começa a filtrar só o que realmente dá resultado.", "paras": ["O primeiro que aparece é o mercado de lançamento. Funciona, mas você precisa criar perfil, aparecer na câmera quase todo dia, gravar dezenas de vídeos por meses e ainda pagar anúncio para encher um evento ao vivo antes de saber se alguém vai comprar. Aí você vê um guru falando sobre rodar Low Ticket.", "Só que ele não te conta o resto. Você precisa criar o produto, montar a página, gravar vários anúncios, pagar ferramenta para espionar concorrente e separar de oito a dez mil reais no bolso só para testar até achar algo que dê lucro. Você não tem dez mil reais parados para queimar.", "Então procura um jeito de vender sem precisar investir em anúncios. O primeiro caminho que aparece é ser um afiliado no TikTok Shop, na Shopee ou no Mercado Livre. Só que ali tem milhares de pessoas divulgando os mesmos produtos, a comissão é de poucos reais por venda e você precisa viralizar o tempo todo para fechar o mês.", "Aí você olha para o canal dark no YouTube, sem aparecer e sem depender de produto físico. Só que leva de três a seis meses editando vídeos longos só para bater mil inscritos e quatro mil horas. Mesmo chegando lá, o YouTube derruba vários canais por conteúdo reutilizado, e no Brasil cada mil visualizações paga apenas alguns reais.", "No Brasil, sem aparecer e sem dez mil reais para anunciar, a conta quase nunca fecha. Então você descobre uma forma de vender nos Estados Unidos estando no Brasil, usando o mercado do ODR: ganhar em dólar postando vídeos curtos de vinte segundos no Facebook, feitos com inteligência artificial. Para rodar isso, você não cria produto do zero.", "Primeiro, entra na BuyGoods, na ClickBank ou na Digistore e se afilia a um produto físico que paga comissão em dólar. Depois, cria uma página no Facebook e configura o país para entregar seus vídeos apenas nos Estados Unidos. Depois, usa a inteligência artificial para gerar vídeos curtos de vinte segundos em inglês, sem mostrar seu rosto, despertando curiosidade para levar o americano a comprar aquele produto da BuyGoods, sem gastar um centavo em anúncio.", "Só que rodando sozinho você bate em quatro travas. Os produtos abertos dessas plataformas convertem mal. Você não acerta o formato dos vídeos e perde horas fazendo tudo na mão.", "Tem que postar no braço todo dia. E ainda precisa construir página, montar VSL, pagar hospedagem, comprar domínio e assinar ferramenta de rastreamento. Na zero zero um, você pula essas quatro travas.", "Não precisa construir página, VSL, hospedagem, domínio nem gastar com ferramenta de rastreamento. Você entra com produtos exclusivos de alta conversão que pagam comissão em dólar. E usa uma automação que cria os vídeos no formato certo e posta tudo no automático.", "Sem aparecer, sem queimar dez mil reais em anúncio e sem perder meses esperando centavos no Brasil. Se você quer ver essa estrutura por dentro, assiste o primeiro vídeo fixado do perfil. E comenta aqui embaixo qual dessas etapas você quer ver desmontada."], "extraTitle": "Cola rápida (Freestyle)", "bullets": []}, {"id": "r-114", "num": 114, "group": "12. Animações, PS2 e Faceless (7)", "kind": "animacao", "title": "Faceless 7 Atos: \"Fazer Sozinho\" (Caio do Atacadão -> 001)", "note": "Storytelling Faceless 80s | Arco completo de 7 atos (Atacadão -> curso de R$ 5 mil -> 40 dias 0 vendas -> Rodrigo -> virada).", "hook": "Ele pagou R$ 5.000 num curso que ensinava a fazer tudo sozinho. 40 dias depois: zero vendas.", "paras": ["<strong>Ato 1: A vida (0:00 a 0:10):</strong> Atacadão, corredor de bebidas, luz fluorescente. Caio empurrando o paleteira. <strong>Gerente:</strong> &quot;Fileira três está vazia faz uma hora.&quot; <strong>Caio:</strong> &quot;Já estou indo.&quot; Close na olheira. O celular vibra no bolso do uniforme. Ele olha. Guarda.", "<strong>Ato 2: A aposta (0:10 a 0:18):</strong> Cozinha, noite. Notebook na mesa. Comprovante em tela: <strong><span class=\"hl\">R$ 5.000,00</span></strong> <strong>Dona Vera:</strong> &quot;Cinco mil reais num curso?&quot; <strong>Caio:</strong> &quot;É o caminho, mãe. Eles ensinam tudo.&quot; <strong>Dona Vera:</strong> &quot;Tudo o quê?&quot; <strong>Caio:</strong> &quot;Eles ensinam a fazer sozinho.&quot;", "<strong>Ato 3: A moenda (0:18 a 0:36):</strong> Corte a 0,5s, com borrão de movimento entre planos. Zero fala. Só o som de teclado, notificação e o alarme. Relógio: <strong>1:47</strong>. Ele escrevendo prompt. Barra de progresso. Um take sai. Ele baixa. Escreve outro prompt. Outro take. Outro. A pasta de downloads com dezenas de arquivos soltos. O editor aberto, ele arrastando take por take na linha do tempo. O dedo ajustando legenda quadro a quadro. Ele colando link de afiliado num campo, conferindo, colando de novo. Alarme: <strong>5:20</strong>. Ele dormindo de roupa, notebook aberto na cama. Atacadão. Ele empilha errado. A pilha desaba. O barulho. O gerente gritando. Os colegas parando para olhar. Em tela: <strong><span class=\"hl\">40 dias. 0 vendas.</span></strong>", "<strong>Ato 4: A derrota (0:36 a 0:48):</strong> Calçada, fim de turno. <strong>Du:</strong> &quot;Larga isso, mano. Tu vai ser mandado embora por causa de internet.&quot; Cozinha. Dona Vera fala baixo. Sem desprezo: com dó. É isso que machuca. <strong>Dona Vera:</strong> &quot;Filho, desiste. Você está se acabando.&quot; Ele arrasta a pasta para a lixeira. Fecha o notebook. <strong>Plano único, 2,5 segundos, luz fria:</strong> Caio sentado na beirada da cama, no escuro, o notebook fechado ao lado. Não se mexe. Ele tira o crachá e pendura no prego da parede. Fica olhando.", "<strong>Ato 5: O mentor (0:48 a 1:02):</strong> Vestiário do Atacadão, intervalo. Ele rolando o feed sem vontade, mastigando. Para num vídeo. <strong>Rodrigo, na tela do celular.</strong> <strong>Rodrigo:</strong> &quot;Você não precisa fazer na mão.&quot; <strong>Rodrigo:</strong> &quot;A ferramenta gera no automático, sozinha, enquanto você faz qualquer outra coisa.&quot; <strong>Rodrigo:</strong> &quot;Estrutura, vídeo e postagem. Você só escolhe o produto.&quot; Insertos de tela real entre as falas (ver seção <strong>Insertos</strong>). Close no Caio. Ele para de mastigar. Olha para o crachá pendurado no armário.", "<strong>Ato 6: A volta (1:02 a 1:12):</strong> Ele abre a lixeira do notebook e <strong>restaura a pasta</strong>. Callback do Ato 4. Agora é leve e rápido, o oposto da moenda: ele clica no produto, a estrutura sobe, o lote de vídeo é gerado. Ele fecha o notebook e vai dormir. <strong>O celular apita sozinho na mesa, no escuro.</strong> Close na notificação → o rosto dele acordando → <strong>inserto do print real do painel, com data.</strong>", "<strong>Ato 7: A punch line (1:12 a 1:18):</strong> Cozinha, manhã. Dona Vera está com o celular dele na mão, olhando a tela. <strong>Dona Vera:</strong> &quot;Isso aqui é de verdade?&quot; <strong>Caio:</strong> &quot;É.&quot; <strong>Dona Vera:</strong> <em>(pausa)</em> &quot;Me ensina a fazer.&quot; <strong>Caio:</strong> &quot;Ninguém mais precisa fazer sozinho.&quot; Ela puxa a cadeira e senta do lado dele. Ninguém pede desculpa. Último plano: o crachá do Atacadão no lixo.", "<strong>CTA (1:18 a 1:20):</strong> Falado por cima do último plano, e em tela: &quot;O caminho inteiro está no post fixado.&quot; ---"], "extraTitle": "Cola rápida (Freestyle)", "bullets": []}, {"id": "r-115", "num": 115, "group": "12. Animações, PS2 e Faceless (7)", "kind": "animacao", "title": "Animação: O Rato no Pote do Real vs. A Alavanca de US$ 200", "note": "Central de Produção · Modalidade 2 | Metáfora visual + contraste de quem escolheu uma vida normal.", "hook": "O Rato no Pote do Real vs. A Alavanca de US$ 200: como é para quem escolheu uma vida normal.", "paras": ["[ESTILO VISUAL · HAND-DRAWN / TRAÇO BRANCO E LARanja #F15A22 SOBRE FUNDO #070709]", "Frame 0 (0.0s): Um personagem desenhado correndo dentro de um pote de vidro fechado com o rótulo &quot;SALÁRIO EM REAL (R$)&quot;, batendo a cabeça na tampa de vidro.", "Texto na Tela: A NOVA CORRIDA DOS RATOS (E A PORTA DE SAÍDA)", "Voz Narrada: &quot;Se você colocar um rato dentro de um pote fechado por tempo suficiente, mesmo depois que você tira a tampa, ele continua pulando só até a altura do vidro.&quot;", "[CORPO &quot;MAS / PORTANTO&quot; · 4.0s a 40.0s]", "&quot;Foi exatamente isso que fizeram com quem escolheu uma vida normal aqui no Brasil.", "Convenceram você de que o seu teto é trabalhar o mês inteiro para receber em uma moeda que vale cinco vezes menos que o dólar.", "MAS a tampa desse pote já foi tirada pela inteligência artificial, e quase ninguém olhou para cima.", "Hoje existem empresas gigantes nos Estados Unidos que pagam duzentos dólares por venda, o que coloca mil reais no seu bolso de uma vez const STORE_DONE = "roteiro_reels_001_done_v1";
const STORE_FONT = "roteiro_reels_001_font_v1";

let doneMap = {};
try { doneMap = JSON.parse(localStorage.getItem(STORE_DONE) || "{}"); } catch (e) { doneMap = {}; }

let sz = parseInt(localStorage.getItem(STORE_FONT) || "21", 10);
if (isNaN(sz) || sz < 15 || sz > 34) sz = 21;
document.documentElement.style.setProperty("--sz", sz + "px");

let currentFilter = "todos";
let searchTerm = "";
let currentId = "r-120";
let collapsedGroups = {};

// Se tiver hash na URL (#r-001), abre direto nele
if (location.hash && ITEMS.some(x => x.id === location.hash.slice(1))) {
  currentId = location.hash.slice(1);
}

function norm(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function getFiltered() {
  const q = norm(searchTerm.trim());
  return ITEMS.filter(it => {
    if (currentFilter === "pronto" && it.kind !== "pronto") return false;
    if (currentFilter === "ideia" && it.kind !== "ideia" && it.kind !== "banco") return false;
    if (currentFilter === "animacao" && it.kind !== "animacao") return false;
    if (currentFilter === "pendentes" && doneMap[it.id]) return false;
    if (q) {
      const hay = norm(it.title + " " + it.group + " " + it.note + " " + it.hook + " " + it.paras.join(" ") + " " + it.bullets.join(" "));
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderList() {
  const list = getFiltered();
  const totalDone = Object.keys(doneMap).filter(k => doneMap[k]).length;
  document.getElementById("sb-count").textContent = list.length + " itens (" + totalDone + " gravados)";

  const container = document.getElementById("sb-list");
  if (!list.length) {
    container.innerHTML = '<div class="empty">Nenhum roteiro encontrado.</div>';
    return;
  }

  const groupsOrder = [];
  const byGroup = {};
  list.forEach(it => {
    if (!byGroup[it.group]) {
      byGroup[it.group] = [];
      groupsOrder.push(it.group);
    }
    byGroup[it.group].push(it);
  });

  const qActive = searchTerm.trim().length > 0;
  let out = "";
  groupsOrder.forEach(grp => {
    const isClosed = !qActive && !!collapsedGroups[grp];
    out += '<div class="grp' + (isClosed ? ' closed' : '') + '">';
    out += '<button class="grp-head" data-grp="' + grp.replace(/"/g, "&quot;") + '">';
    out += '<span>' + grp + '</span><span>' + (isClosed ? '+' : '-') + '</span></button>';
    out += '<div class="grp-items">';
    byGroup[grp].forEach(it => {
      const cls = ["item-btn"];
      if (it.id === currentId) cls.push("active");
      if (doneMap[it.id]) cls.push("done");
      out += '<button class="' + cls.join(" ") + '" data-id="' + it.id + '">';
      out += '<span class="item-num">' + String(it.num).padStart(2, "0") + '</span>';
      out += '<span>' + it.title + '</span></button>';
    });
    out += '</div></div>';
  });

  container.innerHTML = out;

  container.querySelectorAll(".grp-head").forEach(btn => {
    btn.addEventListener("click", () => {
      const g = btn.getAttribute("data-grp");
      collapsedGroups[g] = !collapsedGroups[g];
      renderList();
    });
  });

  container.querySelectorAll(".item-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      selectItem(btn.getAttribute("data-id"));
      closeMobList();
    });
  });
}

function isMob() { return window.innerWidth <= 860; }
function closeMobList() {
  document.body.classList.remove("mob-list-open");
}

function selectItem(id, keepScroll) {
  const it = ITEMS.find(x => x.id === id);
  if (!it) return;
  currentId = id;
  try { history.replaceState(null, "", "#" + id); } catch (e) {}

  let bodyHtml = "";
  bodyHtml += '<div class="eyebrow">#' + String(it.num).padStart(2, "0") + ' · ' + it.group + '</div>';
  bodyHtml += '<h1>' + it.title + '</h1>';
  if (it.note) bodyHtml += '<div class="nota">' + it.note + '</div>';

  bodyHtml += '<div class="fala">';
  if (it.hook) bodyHtml += '<p class="hook">' + it.hook + '</p>';
  it.paras.forEach(p => {
    if (p.startsWith("<h2") || p.startsWith("<h3")) {
      bodyHtml += p;
    } else {
      bodyHtml += '<p>' + p + '</p>';
    }
  });
  bodyHtml += '</div>';

  if (it.bullets && it.bullets.length) {
    bodyHtml += '<hr class="divisor">';
    bodyHtml += '<div class="sub">' + (it.extraTitle || 'Cola rápida (Freestyle)') + '</div>';
    bodyHtml += '<ul class="bullets">';
    it.bullets.forEach(b => {
      bodyHtml += '<li>' + b + '</li>';
    });
    bodyHtml += '</ul>';
  }

  document.getElementById("reader").innerHTML = bodyHtml;

  const doneBtn = document.getElementById("btn-done");
  const isDone = !!doneMap[id];
  doneBtn.textContent = isDone ? "Gravado (Desmarcar)" : "Marcar gravado";
  doneBtn.classList.toggle("done-on", isDone);

  renderList();
  if (!keepScroll) window.scrollTo(0, 0);
}

function step(dir) {
  const list = getFiltered();
  if (!list.length) return;
  let idx = list.findIndex(x => x.id === currentId);
  if (idx === -1) idx = 0;
  else idx = (idx + dir + list.length) % list.length;
  selectItem(list[idx].id);
  const activeEl = document.querySelector(".item-btn.active");
  if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
}

function toggleDone() {
  doneMap[currentId] = !doneMap[currentId];
  try { localStorage.setItem(STORE_DONE, JSON.stringify(doneMap)); } catch (e) {}
  selectItem(currentId, true);
}

function toggleList() {
  if (isMob()) {
    document.body.classList.toggle("mob-list-open");
    return;
  }
  document.body.classList.toggle("hide-list");
  const hidden = document.body.classList.contains("hide-list");
  document.getElementById("btn-toggle-list").textContent = hidden ? "Abrir Lista" : "Esconder Lista";
}

function fonte(d) {
  sz = Math.min(34, Math.max(15, sz + d));
  document.documentElement.style.setProperty("--sz", sz + "px");
  try { localStorage.setItem(STORE_FONT, String(sz)); } catch (e) {}
}

function copyCurrent() {
  const el = document.getElementById("reader");
  const txt = el ? el.innerText : "";
  const btn = document.getElementById("btn-copy");
  if (navigator.clipboard && txt) {
    navigator.clipboard.writeText(txt).then(() => {
      btn.textContent = "Copiado!";
      setTimeout(() => { btn.textContent = "Copiar texto"; }, 1400);
    });
  }
}

document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value;
  renderList();
});

document.getElementById("filters").querySelectorAll(".fbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.getElementById("filters").querySelectorAll(".fbtn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.getAttribute("data-f");
    renderList();
  });
});

document.addEventListener("keydown", e => {
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  if (e.key === "l" || e.key === "L") toggleList();
  if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); step(1); }
  if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
});

selectItem(currentId);
</script>
</body>
</html>
